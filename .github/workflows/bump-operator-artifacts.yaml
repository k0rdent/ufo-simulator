name: bump-operator-artifacts

# Fetch latest UFO / Verity / NICo operator chart+image tags from each repo's
# successful `dev-build-artifacts.yml` run on the chosen branch (same approach as
# k0rdent/core-services e2e-periodic-ufo), then open a PR that bumps:
#   - ansible/vars/artifacts-main.yaml              when release is "main"
#   - ansible/vars/artifacts-<release>.yaml         otherwise (create or update)
#
# Requires repo secret GH_RUNNERS_READ_PAT (PAT that can read Actions artifacts from
# k0rdent/unified-fabric-operator, k0rdent/verity-operator, k0rdent/nico-operator).

on:
  schedule:
    # Weekdays 06:20 UTC — bumps main → ansible/vars/artifacts-main.yaml
    - cron: "20 6 * * 1-5"
  workflow_dispatch:
    inputs:
      release:
        description: >
          Operator git branch to fetch artifacts from (e.g. main, release-v0.3.x).
          Writes ansible/vars/artifacts-main.yaml or ansible/vars/artifacts-<release>.yaml
        required: true
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release || 'main' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      vars_file: ${{ steps.resolve.outputs.vars_file }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
    steps:
      - id: resolve
        name: Resolve release branch and vars file path
        run: |
          set -euo pipefail
          branch="${{ inputs.release || 'main' }}"
          # Reject path traversal / odd names so we only write under ansible/vars/
          if ! [[ "$branch" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "invalid release/branch name: ${branch}" >&2
            exit 1
          fi
          vars_file="ansible/vars/artifacts-${branch}.yaml"
          slug="${branch//\//-}"
          {
            echo "branch=${branch}"
            echo "vars_file=${vars_file}"
            echo "pr_branch=chore/bump-operator-artifacts-${slug}"
          } >> "$GITHUB_OUTPUT"
          echo "branch=${branch} vars_file=${vars_file}"

  get-latest-ufo:
    needs: resolve-release
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.fetch.outputs.chart_version }}
      image_version: ${{ steps.fetch.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get latest unified-fabric-operator
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNERS_READ_PAT }}
          TARGET_REPO: k0rdent/unified-fabric-operator
          WORKFLOW_ID: dev-build-artifacts.yml
          TARGET_BRANCH: ${{ needs.resolve-release.outputs.branch }}
          OUT_DIR: /tmp/ufo-artifacts
        run: |
          chmod +x .github/scripts/get-latest-build-artifacts.sh
          .github/scripts/get-latest-build-artifacts.sh

  get-latest-verity:
    needs: resolve-release
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.fetch.outputs.chart_version }}
      image_version: ${{ steps.fetch.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get latest verity-operator
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNERS_READ_PAT }}
          TARGET_REPO: k0rdent/verity-operator
          WORKFLOW_ID: dev-build-artifacts.yml
          TARGET_BRANCH: ${{ needs.resolve-release.outputs.branch }}
          OUT_DIR: /tmp/verity-artifacts
        run: |
          chmod +x .github/scripts/get-latest-build-artifacts.sh
          .github/scripts/get-latest-build-artifacts.sh

  get-latest-nico:
    needs: resolve-release
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.fetch.outputs.chart_version }}
      image_version: ${{ steps.fetch.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get latest nico-operator
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNERS_READ_PAT }}
          TARGET_REPO: k0rdent/nico-operator
          WORKFLOW_ID: dev-build-artifacts.yml
          TARGET_BRANCH: ${{ needs.resolve-release.outputs.branch }}
          OUT_DIR: /tmp/nico-artifacts
        run: |
          chmod +x .github/scripts/get-latest-build-artifacts.sh
          .github/scripts/get-latest-build-artifacts.sh

  bump-and-pr:
    name: Bump versions and open PR
    needs: [resolve-release, get-latest-ufo, get-latest-verity, get-latest-nico]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply version bumps
        env:
          VARS_FILE: ${{ needs.resolve-release.outputs.vars_file }}
          RELEASE_BRANCH: ${{ needs.resolve-release.outputs.branch }}
          UFO_CHART: ${{ needs.get-latest-ufo.outputs.chart_version }}
          UFO_IMAGE: ${{ needs.get-latest-ufo.outputs.image_version }}
          VERITY_CHART: ${{ needs.get-latest-verity.outputs.chart_version }}
          VERITY_IMAGE: ${{ needs.get-latest-verity.outputs.image_version }}
          NICO_CHART: ${{ needs.get-latest-nico.outputs.chart_version }}
          NICO_IMAGE: ${{ needs.get-latest-nico.outputs.image_version }}
        run: |
          set -euo pipefail
          file="$VARS_FILE"

          set_key() {
            local key="$1" value="$2"
            if grep -qE "^${key}:" "$file"; then
              sed -i -E "s|^(${key}:).*|\1 ${value}|" "$file"
            else
              printf '%s: %s\n' "$key" "$value" >> "$file"
            fi
          }

          if [ ! -f "$file" ]; then
            echo "Creating ${file} for release branch ${RELEASE_BRANCH}"
            {
              echo "# Operator artifact pins for branch ${RELEASE_BRANCH}"
              echo "# Managed by .github/workflows/bump-operator-artifacts.yaml"
              echo
              echo "ufo_chart_repo: oci://registry.ci.mirantis.com/k0rdent-bm/charts/unified-fabric-operator"
              echo "ufo_chart_version: ${UFO_CHART}"
              echo "ufo_image_tag: ${UFO_IMAGE}"
              echo
              echo "verity_operator_chart_repo: oci://registry.ci.mirantis.com/k0rdent-bm/charts/verity-operator"
              echo "verity_operator_chart_version: ${VERITY_CHART}"
              echo "verity_operator_image_tag: ${VERITY_IMAGE}"
              echo
              echo "nico_operator_chart_repo: oci://registry.ci.mirantis.com/k0rdent-bm/charts/nico-operator"
              echo "nico_operator_chart_version: ${NICO_CHART}"
              echo "nico_operator_image: registry.ci.mirantis.com/k0rdent-bm/images/nico-operator"
              echo "nico_operator_image_tag: ${NICO_IMAGE}"
            } > "$file"
          else
            echo "Updating existing ${file}"
            set_key ufo_chart_version "$UFO_CHART"
            set_key ufo_image_tag "$UFO_IMAGE"
            set_key verity_operator_chart_version "$VERITY_CHART"
            set_key verity_operator_image_tag "$VERITY_IMAGE"
            set_key nico_operator_chart_version "$NICO_CHART"
            set_key nico_operator_image_tag "$NICO_IMAGE"
          fi

          {
            echo "## Proposed bumps (\`${RELEASE_BRANCH}\` → \`${file}\`)"
            echo ""
            echo "| Component | Chart | Image |"
            echo "|---|---|---|"
            echo "| unified-fabric-operator | \`${UFO_CHART}\` | \`${UFO_IMAGE}\` |"
            echo "| verity-operator | \`${VERITY_CHART}\` | \`${VERITY_IMAGE}\` |"
            echo "| nico-operator | \`${NICO_CHART}\` | \`${NICO_IMAGE}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          git diff -- "$file" || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: bump UFO / Verity / NICo artifacts (${{ needs.resolve-release.outputs.branch }})

            Update pins in ${{ needs.resolve-release.outputs.vars_file }} from the latest
            successful ${{ needs.resolve-release.outputs.branch }} dev-build-artifacts.yml runs.
          title: "chore: bump operator artifacts (${{ needs.resolve-release.outputs.branch }})"
          body: |
            Automated bump of operator artifacts for branch `${{ needs.resolve-release.outputs.branch }}`.

            Target file: `${{ needs.resolve-release.outputs.vars_file }}` (created if missing).

            Versions from the latest successful `dev-build-artifacts.yml` run on `${{ needs.resolve-release.outputs.branch }}`:

            | Component | Chart | Image |
            |---|---|---|
            | unified-fabric-operator | `${{ needs.get-latest-ufo.outputs.chart_version }}` | `${{ needs.get-latest-ufo.outputs.image_version }}` |
            | verity-operator | `${{ needs.get-latest-verity.outputs.chart_version }}` | `${{ needs.get-latest-verity.outputs.image_version }}` |
            | nico-operator | `${{ needs.get-latest-nico.outputs.chart_version }}` | `${{ needs.get-latest-nico.outputs.image_version }}` |

            Source workflow: `bump-operator-artifacts`.
          branch: ${{ needs.resolve-release.outputs.pr_branch }}
          delete-branch: true
          labels: dependencies
          add-paths: |
            ${{ needs.resolve-release.outputs.vars_file }}
