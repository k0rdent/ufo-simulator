---
# Host DHCP via dnsmasq on CMP bridges.
# - br-pxe: when topology.north_south.fabric_type is "bridge" (br_pxe_dhcp.enabled)
# - br-mgmt: when fabric backend is netris (br_mgmt_dhcp.enabled)
# Run after linux.yml so bridges and addresses are configured.

- name: Enable DHCP servers on CMP bridges
  hosts: cmps
  connection: local
  gather_facts: true
  become: true

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ sdn_provider }}.yml

  handlers:
    - name: Restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted

  tasks:
    - name: Install dnsmasq
      when: (br_pxe_dhcp.enabled | default(false) | bool) or (br_mgmt_dhcp.enabled | default(false) | bool)
      ansible.builtin.apt:
        name: dnsmasq
        state: present
        update_cache: false

    - name: Deploy global dnsmasq configuration
      when: (br_pxe_dhcp.enabled | default(false) | bool) or (br_mgmt_dhcp.enabled | default(false) | bool)
      ansible.builtin.template:
        src: dnsmasq/global.conf.j2
        dest: /etc/dnsmasq.d/00-global.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart dnsmasq

    - name: Remove global dnsmasq configuration when DHCP disabled
      when: not ((br_pxe_dhcp.enabled | default(false) | bool) or (br_mgmt_dhcp.enabled | default(false) | bool))
      ansible.builtin.file:
        path: /etc/dnsmasq.d/00-global.conf
        state: absent
      notify: Restart dnsmasq

    - name: Deploy br-pxe dnsmasq configuration
      when: br_pxe_dhcp.enabled | default(false) | bool
      ansible.builtin.template:
        src: dnsmasq/br-pxe.conf.j2
        dest: /etc/dnsmasq.d/br-pxe.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart dnsmasq

    - name: Remove br-pxe dnsmasq configuration when disabled
      when: not (br_pxe_dhcp.enabled | default(false) | bool)
      ansible.builtin.file:
        path: /etc/dnsmasq.d/br-pxe.conf
        state: absent
      notify: Restart dnsmasq

    - name: Deploy br-mgmt dnsmasq configuration
      when: br_mgmt_dhcp.enabled | default(false) | bool
      ansible.builtin.template:
        src: dnsmasq/br-mgmt.conf.j2
        dest: /etc/dnsmasq.d/br-mgmt.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart dnsmasq

    - name: Remove br-mgmt dnsmasq configuration when disabled
      when: not (br_mgmt_dhcp.enabled | default(false) | bool)
      ansible.builtin.file:
        path: /etc/dnsmasq.d/br-mgmt.conf
        state: absent
      notify: Restart dnsmasq

    - name: Enable and start dnsmasq
      when: (br_pxe_dhcp.enabled | default(false) | bool) or (br_mgmt_dhcp.enabled | default(false) | bool)
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true
