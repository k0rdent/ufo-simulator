---
- name: Install Traefik
  hosts: cmps
  connection: local
  become: true
  gather_facts: true
  ignore_errors: false

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ artifacts_vars_file }}
    - ./vars/{{ sdn_provider }}.yml

  tasks:
    - name: Ensure target directory
      file:
        path: "{{ k8s_artifacts_dir }}/traefik/"
        state: directory

    - name: Handle traefik templates
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "k8s/traefik/{{ item }}"
            dest: "{{ k8s_artifacts_dir }}/traefik/{{ item }}"
          with_items:
            - "traefik.yaml"

    # Installs both the traefik.io and traefik.containo.us CRD groups, the
    # latter being what netris-controller-ha's routers use.
    - name: Deploy/upgrade traefik helm release
      kubernetes.core.helm:
        name: traefik
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: traefik
        chart_repo_url: "{{ traefik_chart_repo }}"
        chart_version: "{{ traefik_chart_version }}"
        release_namespace: "{{ traefik_namespace }}"
        create_namespace: true
        values_files:
          - "{{ k8s_artifacts_dir }}/traefik/traefik.yaml"
        state: present
        wait: true
        wait_timeout: 300s
