---
# Render nico-core-mock inventory Helm values from topology (runs on gtw01).
# Aligns machine UUID/MAC/LLDP with create-vms.yml rules used on cmp01.
- name: Ensure nico-core-mock artifact directory exists
  ansible.builtin.file:
    path: "{{ nico_core_mock_inventory_dir }}"
    state: directory
    mode: "0755"

- name: Build nico-core-mock machines from topology
  ansible.builtin.set_fact:
    nico_core_mock_machines: >-
      {{
        topology.nodes
        | nico_core_mock_machines(
            all_topology_links,
            vm_base_mac,
            vm_port_count,
            switch_base_mac,
            ew_switch_base_mac,
            topology.spines + topology.leafs,
            topology_ew.spines + topology_ew.leafs
          )
      }}

- name: Render nico-core-mock inventory Helm values overlay
  ansible.builtin.template:
    src: k8s/nico/nico_core_mock_inventory_values.yaml.j2
    dest: "{{ nico_core_mock_inventory_values_file }}"
    mode: "0644"

- name: Also write plain machines.yaml (local go run / debugging)
  ansible.builtin.copy:
    dest: "{{ nico_core_mock_machines_yaml_file }}"
    mode: "0644"
    # to_yaml_quote_strs quotes str fields (IB guids) but leaves bool/int
    # native — unlike to_nice_yaml(default_style='"'), which quotes everything
    # and breaks proto unmarshal into bool/uint32.
    content: |
      {{ {'machines': nico_core_mock_machines} | to_yaml_quote_strs(indent=2) }}

- name: Show rendered nico-core-mock machine count
  ansible.builtin.debug:
    msg: >-
      Rendered {{ nico_core_mock_machines | length }} machines →
      {{ nico_core_mock_inventory_values_file }}
      (also {{ nico_core_mock_machines_yaml_file }})
