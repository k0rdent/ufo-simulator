---
# Create a single switch VM from libvirt/switch.xml.j2
- name: Create libvirt artifacts directory
  ansible.builtin.file:
    path: "{{ artifacts_dir }}/libvirt"
    state: directory

- name: "{{ switch_name }} - Check if VM exists"
  command: virsh dominfo {{ switch_name }}
  register: vm_exists
  failed_when: false
  changed_when: false

- name: "{{ switch_name }} - Build NIC / link facts"
  ansible.builtin.include_tasks: tasks/build-switch-nics.yml

- name: "{{ switch_name }} - Debug links"
  debug:
    msg: >-
      Links for {{ switch_name }}: {{ switch_links }}
      ; mgmt MAC {{ switch_mgmt_mac }}
      ; breakout names={{ switch_uses_breakout_names }}
      {%- if switch_host_bridge %}
      ; host bridge {{ switch_host_bridge }} is connected to {{ switch_host_bridge_port }} ({{ switch_host_bridge_mac }})
      {%- endif %}

- name: "{{ switch_name }} - Render VM xml"
  ansible.builtin.template:
    src: "libvirt/switch.xml.j2"
    dest: "{{ artifacts_dir }}/libvirt/{{ switch_name }}.xml"

- name: "{{ switch_name }} - Define VM from xml"
  ansible.builtin.command: virsh define {{ artifacts_dir }}/libvirt/{{ switch_name }}.xml
  when: vm_exists.rc != 0

- name: "{{ switch_name }} - Start VM if not running"
  command: virsh start {{ switch_name }}
  register: start_result
  failed_when: start_result.rc != 0 and 'already active' not in start_result.stderr
  changed_when: start_result.rc == 0

- name: "{{ switch_name }} - Set autostart"
  command: virsh autostart {{ switch_name }}
  changed_when: false
