# Both API calls below are retried. The controller runs a single
# web-service-backend replica, so it can go briefly unresponsive under load -
# notably while a batch of switches reboots and reconnects.
- name: Authenticate and capture session cookie
  ansible.builtin.uri:
    url:         "{{ netris_web_api_url }}/api/auth"
    method:      POST
    body_format: json
    body: >-
      {
        "user": "{{ netris_admin_username }}",
        "password": "{{ netris_admin_password }}",
        "auth_scheme_id": 1
      }
    headers:
      Content-Type: "application/json"
    validate_certs:  false           # equivalent to curl -k
    status_code:     200
    timeout:         30
    return_content:  true            # optional — if you want the JSON body too
  register: login
  until: login.status == 200
  retries: 10
  delay: 6

# cookies_string, not set_cookie: /api/auth returns two Set-Cookie headers
# (Traefik's sticky-session cookie and Netris' connect.sid), and set_cookie is
# their raw concatenation, which is not a usable Cookie header value - the
# controller rejects it with 401. cookies_string renders "k=v; k2=v2" properly.
- name: Set cookie fact
  ansible.builtin.set_fact:
    netris_login_cookie: "{{ login.cookies_string }}"

- name: Get netris general settings
  ansible.builtin.uri:
    url:         "{{ netris_web_api_url }}/api/v2/general"
    method:      GET
    validate_certs: false
    headers:
      Cookie:    "{{ netris_login_cookie }}"
    timeout:        30
    return_content: true
  register: api_result
  until: api_result.status == 200
  retries: 10
  delay: 6

- name: Extract netris_auth_token from general settings
  ansible.builtin.set_fact:
    netris_auth_token: >-
      {{ api_result.json.data
         | selectattr('name', 'equalto', 'netris_auth_token')
         | map(attribute='value')
         | first
         | default('')
         | trim
         | replace('\n', '')
         | replace('\r', '')
      }}
