---
# nginx in front of Kong for the TLS gateway. After the k0rdent-apis chart:
# nginx resolves its kong-proxy upstream at startup and exits until that
# Service exists. Needs the facts set by k0rdent-apis-gateway-tls.yml.

- name: Ensure gateway nginx configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: k0rdent-apis-gateway-tls
        namespace: "{{ k0rdent_apis_namespace }}"
      data:
        default.conf: |
          server {
            listen 8443 ssl;
            ssl_certificate     /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;

            location / {
              proxy_pass         http://kong-proxy.{{ k0rdent_apis_namespace }}.svc.cluster.local:8000;
              proxy_http_version 1.1;
              proxy_set_header   Host              $http_host;
              proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto https;
              proxy_set_header   X-Forwarded-Port  {{ k0rdent_apis_gateway_tls_node_port }};
            }
          }
  register: k0rdent_apis_gateway_tls_conf

- name: Ensure gateway Deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: k0rdent-apis-gateway-tls
        namespace: "{{ k0rdent_apis_namespace }}"
        labels:
          app: k0rdent-apis-gateway-tls
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: k0rdent-apis-gateway-tls
        template:
          metadata:
            labels:
              app: k0rdent-apis-gateway-tls
            annotations:
              # Restart nginx when the certificate or config changes.
              ufo-simulator/tls-config: >-
                {{ (k0rdent_apis_gateway_tls_b64['server.crt'] ~ k0rdent_apis_gateway_tls_conf.result.data['default.conf']) | hash('sha256') }}
          spec:
            containers:
              - name: nginx
                image: "{{ k0rdent_apis_gateway_tls_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - name: https
                    containerPort: 8443
                readinessProbe:
                  tcpSocket:
                    port: https
                  periodSeconds: 5
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                volumeMounts:
                  - name: tls
                    mountPath: /etc/nginx/tls
                    readOnly: true
                  - name: conf
                    mountPath: /etc/nginx/conf.d
                    readOnly: true
            volumes:
              - name: tls
                secret:
                  secretName: "{{ k0rdent_apis_gateway_tls_secret }}"
              - name: conf
                configMap:
                  name: k0rdent-apis-gateway-tls
    wait: true
    wait_timeout: 300

- name: Ensure gateway NodePort Service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: k0rdent-apis-gateway-tls
        namespace: "{{ k0rdent_apis_namespace }}"
      spec:
        type: NodePort
        selector:
          app: k0rdent-apis-gateway-tls
        # One expression keeps nodePort an integer.
        ports: >-
          {{ [{'name': 'https', 'port': 443, 'targetPort': 'https',
               'nodePort': k0rdent_apis_gateway_tls_node_port | int}] }}
