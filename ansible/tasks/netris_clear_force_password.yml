# Clear Netris "must change password" after install.
#
# Login response field (confirmed on controller):
#   data.mandatoryPasswordChange  (bool)
#
# Chart init SQL inserts the admin with salt='true'; when the flag is still
# true after login, clear it in MariaDB (no public password-change REST path
# found — candidate /api/*/password endpoints all 404).

- name: Login to Netris (check mandatoryPasswordChange)
  ansible.builtin.uri:
    url: "{{ netris_web_api_url }}/api/auth"
    method: POST
    body_format: json
    body:
      user: "{{ netris_admin_username }}"
      password: "{{ netris_admin_password }}"
      auth_scheme_id: 1
    headers:
      Content-Type: application/json
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 30
    return_content: true
  register: netris_pw_login
  until: netris_pw_login.status == 200
  retries: 20
  delay: 6
  no_log: true

- name: Record mandatoryPasswordChange from login
  ansible.builtin.set_fact:
    netris_mandatory_password_change: >-
      {{ netris_pw_login.json.data.mandatoryPasswordChange | default(false) | bool }}

- name: Report mandatoryPasswordChange
  ansible.builtin.debug:
    msg: "mandatoryPasswordChange={{ netris_mandatory_password_change }}"

- name: Fetch MariaDB credentials secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Secret
    name: netris-controller-ha-mariadb
    namespace: netris-controller
  register: netris_mdb_secret
  when: netris_mandatory_password_change | bool

# salt='true' on the users row is what the chart seeds; clearing it clears
# mandatoryPasswordChange on the next login.
- name: Clear users.salt so mandatoryPasswordChange becomes false
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubeconfig_path }}
      - -n
      - netris-controller
      - exec
      - netris-controller-ha-mariadb-ha-0
      - -c
      - mariadb
      - --
      - mariadb
      - -unetris
      - -p{{ netris_mdb_secret.resources[0].data['mariadb-password'] | b64decode }}
      - netris
      - -e
      - UPDATE users SET salt='false' WHERE login='{{ netris_admin_username }}' AND salt='true';
  register: netris_clear_force_pw
  until: netris_clear_force_pw.rc == 0
  retries: 10
  delay: 5
  no_log: true
  changed_when: netris_clear_force_pw.rc == 0
  when: netris_mandatory_password_change | bool

- name: Re-login to confirm mandatoryPasswordChange is false
  ansible.builtin.uri:
    url: "{{ netris_web_api_url }}/api/auth"
    method: POST
    body_format: json
    body:
      user: "{{ netris_admin_username }}"
      password: "{{ netris_admin_password }}"
      auth_scheme_id: 1
    headers:
      Content-Type: application/json
    validate_certs: false
    status_code: 200
    timeout: 30
    return_content: true
  register: netris_pw_login_after
  retries: 5
  delay: 3
  no_log: true
  when: netris_mandatory_password_change | bool

- name: Fail if mandatoryPasswordChange is still set
  ansible.builtin.assert:
    that:
      - not (netris_pw_login_after.json.data.mandatoryPasswordChange | default(false) | bool)
    fail_msg: >-
      mandatoryPasswordChange is still true after clearing users.salt
  when: netris_mandatory_password_change | bool
