---
# Prepare lab e2e pytest venv + sourceable env file.
#
#   cd /opt/ufo_lab/ufo-simulator/ansible
#   ansible-playbook prepare-e2e-tests.yml
#
# Then on the CMP:
#   source /opt/ufo_simulator/venvs/e2e/env
#   cd "$E2E_DIR" && pytest -m smoke -s
- name: Prepare k0rdent-apis e2e tests
  hosts: cmps
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - ./vars/common.yml

  vars:
    # User-requested venv root (outside /opt/ufo_lab).
    e2e_venv_dir: /opt/ufo_simulator/venvs/e2e
    e2e_env_file: "{{ e2e_venv_dir }}/env"
    e2e_dir: "{{ (playbook_dir ~ '/../k0rdent-apis/e2e') | realpath }}"
    e2e_requirements: "{{ e2e_dir }}/requirements.txt"
    e2e_api_base: "http://10.200.0.254:30080"
    e2e_region: local
    e2e_project: kind-main
    e2e_kubeconfig: "{{ kubeconfig_path | default('/root/.kube/config') }}"
    e2e_token_file: /tmp/k0r-token
    e2e_token_slack_sec: 60

  tasks:
    - name: Prepare e2e tests
      ansible.builtin.import_tasks: tasks/prepare-e2e-tests.yml
      tags: [prepare-e2e-tests]
