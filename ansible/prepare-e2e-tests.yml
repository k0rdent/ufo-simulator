---
# Prepare lab e2e pytest venv + sourceable env file + HCP host-cluster registry.
#
#   cd /opt/ufo_lab/ufo-simulator/ansible
#   ansible-playbook prepare-e2e-tests.yml
#
# Then on the CMP:
#   source /opt/ufo_simulator/venvs/e2e/env
#   cd "$E2E_DIR" && pytest -m smoke -s
#
# Also creates kcm-system/host-cluster-a-kubeconfig (from the management
# kubeconfig) and kcm-system/hcp-host-clusters keyed by every id in
# e2e_hcp_cluster_type_ids, so ResolveHCPHostCluster succeeds for HCP e2e
# creates.
- name: Prepare k0rdent-apis e2e tests
  hosts: cmps
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ artifacts_vars_file }}
    # Needed for ufo_fabric_backend, which the env file exports as
    # E2E_FABRIC_BACKEND to gate the per-backend e2e tests. group_vars defines
    # ufo_fabric_backend as netris, so without this the gate renders netris on
    # every lab -- including a verity one, where the verity test would then skip
    # silently and the suite would stay green having tested nothing.
    - ./vars/{{ sdn_provider }}.yml

  vars:
    # User-requested venv root (outside /opt/ufo_lab).
    e2e_venv_dir: /opt/ufo_simulator/venvs/e2e
    e2e_env_file: "{{ e2e_venv_dir }}/env"
    e2e_dir: "{{ (playbook_dir ~ '/../k0rdent-apis/e2e') | realpath }}"
    e2e_requirements: "{{ e2e_dir }}/requirements.txt"
    e2e_api_base: "http://10.200.0.254:30080"
    e2e_region: local
    e2e_project: kind-main
    e2e_kubeconfig: "{{ kubeconfig_path | default('/root/.kube/config') }}"
    e2e_token_file: /tmp/k0r-token
    e2e_token_slack_sec: 60
    # KCM-1205: ResolveHCPHostCluster needs a kubeconfig Secret in kcm-system
    # plus an hcp-host-clusters ConfigMap entry keyed by ClusterType id.
    # Lab HCP CPs land on the management cluster itself.
    e2e_hcp_host_cluster_secret_name: host-cluster-a-kubeconfig
    e2e_hcp_host_cluster_secret_namespace: kcm-system
    # Every ClusterType an HCP e2e can create from. A missing entry fails the
    # create with "no host cluster registered for ClusterType".
    e2e_hcp_cluster_type_ids:
      - nico-hcp
      - netris-hcp-ew
      - nico-verity-hcp-ew

  tasks:
    - name: Prepare e2e tests
      ansible.builtin.import_tasks: tasks/prepare-e2e-tests.yml
      tags: [prepare-e2e-tests]
