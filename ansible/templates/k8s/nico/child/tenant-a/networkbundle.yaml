# NetworkBundle for NICO backend.
apiVersion: ufo.mirantis.com/v1alpha1
kind: NetworkBundle
metadata:
  name: tenant-a-networkbundle
  namespace: tenant-a
spec:
  clusterName: tenant-a-cluster
  networkv2:
    ethernets:
      enp1s0:
        dhcp4: true
        connectToNetwork:
          name: ns-network
      # Each rail NIC gets a /31 facing its leaf, so every other host is off-link
      # even on the same rail. Without these routes a node can reach its own leaf
      # and nothing else. Both targets are symbolic and resolve per interface
      # against that NIC's rail, so the same block is correct on every rail:
      #   cidrFromRailsubnet -> this rail's /25  (172.16.0.0/25 for rail 0)
      #   cidrFromSubnet     -> the whole fabric
      #   gatewayFromSubnet  -> the leaf on the other half of this /31
      eth-ew0:
        match:
          fabricLocation:
            railId: 0
        addresses:
          - ipFromSubnet:
              name: ew-subnet
        routes: &ew-routes
          - to:
              cidrFromRailsubnet:
                name: ew-subnet
            via:
              gatewayFromSubnet:
                name: ew-subnet
          - to:
              cidrFromSubnet:
                name: ew-subnet
            via:
              gatewayFromSubnet:
                name: ew-subnet
      eth-ew1:
        match:
          fabricLocation:
            railId: 1
        addresses:
          - ipFromSubnet:
              name: ew-subnet
        routes: *ew-routes
      eth-ew2:
        match:
          fabricLocation:
            railId: 2
        addresses:
          - ipFromSubnet:
              name: ew-subnet
        routes: *ew-routes
      eth-ew3:
        match:
          fabricLocation:
            railId: 3
        addresses:
          - ipFromSubnet:
              name: ew-subnet
        routes: *ew-routes
    nvlinks:
      nvlink1:
        connectToNetwork:
          name: nvlink-partition
