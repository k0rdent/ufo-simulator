# Ethernet network
apiVersion: ufo.mirantis.com/v1alpha1
kind: Network
metadata:
  name: ns-network
  namespace: tenant-a
spec:
  vpc: tenant-a
  type: l3vpn
---
# Ethernet network
apiVersion: ufo.mirantis.com/v1alpha1
kind: Network
metadata:
  name: public-network
  namespace: tenant-a
spec:
  vpc: tenant-a
  type: l3vpn
---
# Ethernet network
apiVersion: ufo.mirantis.com/v1alpha1
kind: Network
metadata:
  name: ew-network
  namespace: tenant-a
spec:
  vpc: tenant-a-ewf
  type: l3vpn
---
# Will create VPCPrefixes in NICO and corresponding Subnets in UFO

apiVersion: ufo.mirantis.com/v1alpha1
kind: SubnetAllocation
metadata:
  name: ns-subnet
  namespace: tenant-a
spec:
  vpc: tenant-a
  network: ns-network
  prefix_length: 27
  subnetpool: default
  subnet: ns-subnet
---
apiVersion: ufo.mirantis.com/v1alpha1
kind: SubnetAllocation
metadata:
  name: public-subnet
  namespace: tenant-a
spec:
  vpc: tenant-a
  network: public-network
  prefix_length: 29
  subnetpool: public
  subnet: public-subnet
---
apiVersion: ufo.mirantis.com/v1alpha1
kind: Subnet
metadata:
  name: ew-subnet
  namespace: tenant-a
spec:
  vpc: tenant-a-ewf
  network: ew-network
  # Base for the rail-optimised /31s. The allocator adds
  # (rail << 17) | (su << 8) | (host << 1) and gives the host the even address,
  # the switch the odd one -- so rail 0 host 0 is 172.16.0.0/31 with the leaf
  # on .1, host 1 is .2/.3, and each rail occupies 172.(16 + 2*rail).0.0/25.
  #
  # Must match the fabric controller's underlay pool exactly: both sides derive
  # the /31 independently from the same location fields, so a different base
  # means different addresses at the two ends of one wire and the link never
  # comes up. Verity allocates from 172.16.0.0; 10.0.0.0/8 put every host
  # address 16 low in the second octet.
  cidr: 172.16.0.0/12
  addressAllocator:
    backend: rail-optimised
    gpuPlatform: B200
---
# NVLink partition network
apiVersion: ufo.mirantis.com/v1alpha1
kind: Network
metadata:
  name: nvlink-partition
  namespace: tenant-a
spec:
  vpc: tenant-a
  type: nvlink
