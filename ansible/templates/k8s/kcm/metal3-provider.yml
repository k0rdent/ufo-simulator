# NOTE: the shared oot-* HelmRepositories these templates reference live in
# helm-repos.yml, which is applied unconditionally — this file is only applied
# when metal3_provision_enabled is true.
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ProviderTemplate
metadata:
  name: cluster-api-provider-metal3-0.5.0
  annotations:
    helm.sh/resource-policy: keep
spec:
  helm:
    chartSpec:
      chart: cluster-api-provider-metal3
      version: 0.5.0
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: oot-capm3-ci-repo

---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterTemplate
metadata:
  name: capm3-standalone-cp-0.5.0
  namespace: kcm-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  helm:
    chartSpec:
      chart: capm3-standalone-cp
      version: 0.5.0
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: oot-capm3-ci-repo
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterTemplate
metadata:
  name: capm3-hosted-cp-0.5.0
  namespace: kcm-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  helm:
    chartSpec:
      chart: capm3-hosted-cp
      version: 0.5.0
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: oot-capm3-ci-repo

