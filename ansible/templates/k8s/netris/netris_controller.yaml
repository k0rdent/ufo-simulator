# Values for the netris-controller-ha chart
# ({{ netris_controller_chart_repo }}:{{ netris_controller_chart_version }}).
#
# Vendor defaults are 3 for almost every component. This lab is a single node,
# so everything that can scale down is set to 1. Exception:
#   - mongodb: backend hardcodes mongodb-0/1/2 + replicaSet=rs0, must stay 3.
#
# MariaDB / MaxScale / Backup counts are only values-driven if the published
# OCI chart includes the Mirantis patch (stock vendor templates hardcode
# replicas: 3 / until 3). ansible/netris-controller.yml also patches the CRs
# after install as a safety net.
#
# PVC budget: LVP provides 15 static local volumes (templates/k8s/lvp/lvp.yaml).
# The settings below claim ~10: mongodb 3, mariadb 1, backup 1, maxscale 1,
# redis 1, sentinel 1, vmstorage 1, vmselect 1.

netris:
  webLogin: "{{ netris_admin_username }}"
  webPassword: "{{ netris_admin_password }}"

# Served by Traefik (ansible/traefik.yml) on {{ netris_controller_ip }}.
# An empty hosts list renders a host-less rule, so the UI and /api are reachable
# by IP: / -> frontend, /api and /socket.io -> backend.
ingress:
  enabled: true
  hosts: []
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

# Chart defaults: 3 (telescope-notifier / self-monitoring-ha already default 1).
web-service-backend:
  replicaCount: 1
web-service-frontend:
  replicaCount: 1
grpc:
  replicaCount: 1
telescope:
  replicaCount: 1
telescope-notifier:
  replicaCount: 1
web-session-generator:
  replicaCount: 1
self-monitoring:
  replicaCount: 1
self-monitoring-ha:
  replicaCount: 1

# Requires values-driven mariadb-crs.yaml in the OCI chart (see header).
mariadb:
  replicas: 1
  backupCount: 1

maxscale:
  replicas: 1

# Must stay at 3 - see the header comment.
mongodb:
  replicaCount: 3
  resourcesPreset: small

# Chart default redis.replica.replicaCount: 3.
redis:
  replica:
    replicaCount: 1
    resourcesPreset: small
  sentinel:
    resourcesPreset: nano

# Fresh install, so there is no 4.9-era Graphite data to clean up or migrate.
postUpgradeCleanup:
  enabled: false
  migrateGraphiteData: false

# Chart defaults: replicaCount 3 + requiredDuringScheduling anti-affinity.
# Affinity must be `null`, not `{}` - Helm merges empty maps instead of
# replacing them, so `{}` leaves the chart's rule in place.
victoria-metrics-cluster:
  vminsert:
    replicaCount: 1
    affinity: null
  vmselect:
    replicaCount: 1
    affinity: null
  vmstorage:
    replicaCount: 1
    affinity: null
    retentionPeriod: 1
    persistentVolume:
      size: 20Gi
