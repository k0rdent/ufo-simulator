# Values for the vendored netris-controller-ha chart
# (ansible/files/charts/netris-controller-ha, see its PATCHES.md).
#
# The chart ships an HA layout sized for 3 nodes. This lab is a single node, so
# everything that can be scaled down is scaled to 1. Two things cannot:
#   - mongodb: the backend hardcodes mongodb-0/1/2 + replicaSet=rs0 in its
#     connection string, so it must stay at 3.
#   - MariaDB/MaxScale replica counts: hardcoded in the chart, made values-driven
#     by the Mirantis patch recorded in PATCHES.md.
#
# PVC budget: LVP provides 15 static local volumes (templates/k8s/lvp/lvp.yaml).
# The settings below claim ~10: mongodb 3, mariadb 1, backup 1, maxscale 1,
# redis 1, sentinel 1, vmstorage 1, vmselect 1.

netris:
  webLogin: "{{ netris_admin_username }}"
  webPassword: "{{ netris_admin_password }}"

# Served by Traefik (ansible/traefik.yml) on {{ netris_controller_ip }}.
# An empty hosts list renders a host-less rule, so the UI and /api are reachable
# by IP: / -> frontend, /api and /socket.io -> backend.
ingress:
  enabled: true
  hosts: []
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

web-service-backend:
  replicaCount: 1
web-service-frontend:
  replicaCount: 1
grpc:
  replicaCount: 1
telescope:
  replicaCount: 1
telescope-notifier:
  replicaCount: 1
web-session-generator:
  replicaCount: 1
self-monitoring:
  replicaCount: 1
self-monitoring-ha:
  replicaCount: 1

# replicas/backupCount require the Mirantis chart patch (PATCHES.md).
mariadb:
  replicas: 1
  backupCount: 1

maxscale:
  replicas: 1

# Must stay at 3 - see the header comment.
mongodb:
  replicaCount: 3
  resourcesPreset: small

redis:
  replica:
    replicaCount: 1
    resourcesPreset: small
  sentinel:
    resourcesPreset: nano

# Fresh install, so there is no 4.9-era Graphite data to clean up or migrate.
postUpgradeCleanup:
  enabled: false
  migrateGraphiteData: false

# The chart ships requiredDuringScheduling pod anti-affinity on all three
# VictoriaMetrics components. At replicaCount 1 it would not actually block
# scheduling, but it is dropped anyway so the intent is explicit.
# Note: it must be `null`, not `{}` - Helm merges empty maps instead of
# replacing them, so `{}` leaves the chart's rule in place.
victoria-metrics-cluster:
  vminsert:
    replicaCount: 1
    affinity: null
  vmselect:
    replicaCount: 1
    affinity: null
  vmstorage:
    replicaCount: 1
    affinity: null
    retentionPeriod: 1
    persistentVolume:
      size: 20Gi
