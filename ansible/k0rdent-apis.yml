---
- name: Install k0rdent-apis
  hosts: cmps
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ artifacts_vars_file }}
    - ./vars/{{ sdn_provider }}.yml

  vars:
    workspace: /opt/ufo_lab/
    k0rdent_apis_dir: "{{ workspace }}k0rdent-apis"
    k0rdent_apis_namespace: k0rdent-apis
    k0rdent_apis_values_path: /tmp/values-socks-overrides.yaml
    k0rdent_apis_patches_dir: "{{ k0rdent_apis_dir }}/ufo-patches"
    k0rdent_apis_pull_secret_name: ghcr-pull-secret
    k0rdent_apis_pull_secret_server: registry.ci.mirantis.com
    k0rdent_apis_nico_sa_secret: nico-service-account
    k0rdent_apis_nico_sa_password: "{{ nico_client_secret }}"
    k0rdent_apis_provision_env: kind
    k0rdent_apis_helm_timeout: 15m
    k0rdent_apis_extras_helm_timeout: 3m
    k0rdent_apis_base_url: "http://10.200.0.254:30080"
    # TLS gateway in front of Kong (which stays http on :30080), serving the OIDC
    # issuer that workload API servers fetch over https only. Workload API
    # servers must reach host:node_port. Toggling it changes the issuer (users
    # sign in again); false removes it. To terminate TLS elsewhere, set false
    # and override k0rdent_apis_auth_issuer_url.
    k0rdent_apis_gateway_tls_enabled: true
    k0rdent_apis_gateway_tls_host: 10.200.0.254
    k0rdent_apis_gateway_tls_node_port: 30443
    k0rdent_apis_gateway_tls_url: "https://{{ k0rdent_apis_gateway_tls_host }}:{{ k0rdent_apis_gateway_tls_node_port }}"
    # Extra subjectAltNames for the gateway certificate, e.g. ["IP:172.19.116.29"].
    k0rdent_apis_gateway_tls_extra_sans: []
    # Override with a mirror if Docker Hub is unreachable.
    k0rdent_apis_gateway_tls_image: nginx:1.27-alpine
    k0rdent_apis_gateway_tls_pki_dir: "{{ workspace }}pki/k0rdent-apis-gateway"
    # Reissue the server certificate this many days before expiry.
    k0rdent_apis_gateway_tls_renew_days: 30
    k0rdent_apis_gateway_tls_secret: k0rdent-apis-gateway-tls
    k0rdent_apis_issuer_ca_secret: k0rdent-apis-issuer-ca
    # Must be https. Without the gateway this https URL is not actually served,
    # so workload clusters cannot validate OIDC tokens.
    k0rdent_apis_auth_issuer_url: >-
      {{ k0rdent_apis_gateway_tls_url
         if k0rdent_apis_gateway_tls_enabled | bool else 'https://10.200.0.254:30080' }}
    k0rdent_apis_nico_sync_path: "{{ k0rdent_apis_dir }}/nico-sync.sh"
    k0rdent_apis_platform_admin_dir: "{{ k8s_artifacts_dir }}/nico/child/platform_admin"
    k0rdent_apis_helm_repo_url: oci://registry.ci.mirantis.com/k0rdent-apis/charts
    k0rdent_apis_cluster_chart: cluster-nico
    k0rdent_apis_cluster_chart_version: 0.0.0-main

  tasks:
    # Otherwise workload clusters get the lab CA for an issuer it did not sign.
    - name: Refuse an issuer override while the TLS gateway is enabled
      ansible.builtin.assert:
        that:
          - k0rdent_apis_auth_issuer_url == k0rdent_apis_gateway_tls_url
        fail_msg: >-
          k0rdent_apis_auth_issuer_url is {{ k0rdent_apis_auth_issuer_url }}, but the
          TLS gateway ({{ k0rdent_apis_gateway_tls_url }}) is enabled and would hand
          workload clusters its lab CA for that issuer. To terminate TLS elsewhere,
          also set k0rdent_apis_gateway_tls_enabled=false.
        quiet: true
      when: k0rdent_apis_gateway_tls_enabled | bool

    - name: Ensure workspace exists
      ansible.builtin.file:
        path: "{{ workspace }}"
        state: directory

    - name: Ensure patches staging directory exists
      ansible.builtin.file:
        path: "{{ k0rdent_apis_patches_dir }}"
        state: directory

    - name: Stage k0rdent-apis patches
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ k0rdent_apis_patches_dir }}/{{ item | basename }}"
      with_fileglob: "files/k0rdent-apis/patches/*.patch"
      register: k0rdent_apis_staged_patches

    # copy + with_fileglob only ever adds or updates, so a patch RENAMED or
    # DELETED in the repo stays on the node forever and is still applied by the
    # loop below. That is not hypothetical: 26cbe9f consolidated
    # 01-provision-apply-image.patch + 01b-web-origins.patch into
    # 01-web-origins-and-provision-apply.patch, and nodes staged before that
    # kept all three — the stale pair applied first, then the consolidated patch
    # failed both directions (its provision-apply hunk already in the tree, its
    # webOrigins hunk not yet) and failed the play. Make the repo authoritative.
    - name: Find staged patches
      ansible.builtin.find:
        paths: "{{ k0rdent_apis_patches_dir }}"
        patterns: "*.patch"
      register: k0rdent_apis_found_patches

    - name: Remove staged patches no longer vendored in the repo
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ k0rdent_apis_found_patches.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - (item.path | basename) not in (
            k0rdent_apis_staged_patches.results
            | map(attribute='item') | map('basename') | list
          )

    - name: Apply k0rdent-apis patches (skip any already applied)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          shopt -s nullglob
          # Ignore clone-local merge.conflictstyle (e.g. zdiff3) that older
          # system git rejects — it would make every apply --check fail.
          git_apply() { git -c merge.conflictstyle=diff3 apply "$@"; }
          failed=0
          for p in "{{ k0rdent_apis_patches_dir }}"/*.patch; do
            name=$(basename "$p")
            # Reverse-check succeeds ⇒ patch is already in the tree.
            if git_apply --reverse --check "$p" >/dev/null 2>&1; then
              echo "SKIP $name (already applied)"
              continue
            fi
            # Forward-check succeeds ⇒ safe to apply.
            if git_apply --check "$p" >/dev/null 2>&1; then
              git_apply "$p"
              echo "APPLY $name"
              continue
            fi
            # Neither direction applies cleanly — surface git's reason and fail.
            echo "FAIL $name (neither forward nor reverse apply --check succeeded)" >&2
            echo "--- reverse --check ---" >&2
            git_apply --reverse --check "$p" >&2 || true
            echo "--- forward --check ---" >&2
            git_apply --check "$p" >&2 || true
            failed=1
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more ufo-patches failed to apply against {{ k0rdent_apis_dir }}. Refresh the patches under files/k0rdent-apis/patches/ for this checkout." >&2
            exit 1
          fi
        chdir: "{{ k0rdent_apis_dir }}"
        executable: /bin/bash
      register: k0rdent_apis_patch_apply
      changed_when: "'APPLY ' in k0rdent_apis_patch_apply.stdout"

    - name: Ensure k0rdent-apis namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k0rdent_apis_namespace }}"

    - name: Apply mailpit manifest
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        namespace: "{{ k0rdent_apis_namespace }}"
        src: "{{ k0rdent_apis_dir }}/deploy/k8s/mailpit/mailpit.yaml"

    - name: Ensure image pull secret exists in k0rdent-apis and kcm-system
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: "{{ k0rdent_apis_pull_secret_name }}"
            namespace: "{{ item }}"
          data:
            .dockerconfigjson: >-
              {{
                {
                  'auths': {
                    k0rdent_apis_pull_secret_server: {
                      'username': k0rdent_apis_pull_secret_username,
                      'password': k0rdent_apis_pull_secret_password,
                      'auth': (k0rdent_apis_pull_secret_username ~ ':' ~ k0rdent_apis_pull_secret_password) | b64encode
                    }
                  }
                } | to_json | b64encode
              }}
      loop:
        - "{{ k0rdent_apis_namespace }}"
        - kcm-system

    - name: Build k0rdent-apis helm chart dependencies
      ansible.builtin.command:
        cmd: make helm-dep-build
        chdir: "{{ k0rdent_apis_dir }}"
      register: k0rdent_apis_helm_dep
      changed_when: true

    - name: Ensure nico service-account secret exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: "{{ k0rdent_apis_nico_sa_secret }}"
            namespace: "{{ k0rdent_apis_namespace }}"
          stringData:
            password: "{{ k0rdent_apis_nico_sa_password }}"

    - name: Ensure platform-admin artifacts directory exists
      ansible.builtin.file:
        path: "{{ k0rdent_apis_platform_admin_dir }}"
        state: directory
        recurse: true

    - name: Render NICO platform-admin manifests
      ansible.builtin.template:
        src: "k8s/nico/child/platform_admin/{{ item }}"
        dest: "{{ k0rdent_apis_platform_admin_dir }}/{{ item }}"
      loop:
        - ssh-key.yaml
        - security-group.yaml

    - name: Apply NICO platform-admin manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ k0rdent_apis_platform_admin_dir }}/{{ item }}"
      loop:
        - ssh-key.yaml
        - security-group.yaml

    - name: Wait for platform-admin SSHKeyGroup to be reconciled into NICO
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: nico.mirantis.com/v1alpha1
        kind: SSHKeyGroup
        namespace: platform-admin
        name: "{{ nico_prepovision_ssh_key_group_name }}"
      register: nico_platform_admin_ssh_key_group_cr
      until: (nico_platform_admin_ssh_key_group_cr.resources[0].status.id | default('')) | length > 0
      retries: 30
      delay: 5

    - name: Wait for platform-admin NetworkSecurityGroup to be reconciled into NICO
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: nico.mirantis.com/v1alpha1
        kind: NetworkSecurityGroup
        namespace: platform-admin
        name: "{{ nico_prepovision_network_security_group_name }}"
      register: nico_platform_admin_nsg_cr
      until: (nico_platform_admin_nsg_cr.resources[0].status.id | default('')) | length > 0
      retries: 30
      delay: 5

    - name: Fetch NICO resource IDs from REST API
      nico_fetch_resources:
        api_base_url: "{{ nico_api_base_url }}"
        org: "{{ nico_api_org }}"
        token_url: "{{ nico_token_url }}"
        client_id: "{{ nico_client_id }}"
        client_secret: "{{ nico_client_secret }}"
        username: "{{ nico_api_username }}"
        password: "{{ nico_api_password }}"
        ssh_key_group_name: "{{ nico_prepovision_ssh_key_group_name }}"
        network_security_group_name: "{{ nico_prepovision_network_security_group_name }}"
      register: nico_ids

    - name: Ensure required NICO resource IDs for k0rdent-apis are available
      ansible.builtin.assert:
        that:
          - nico_ids.tenant_id | default('') | length > 0
          - nico_ids.ssh_key_group_id | default('') | length > 0
          - nico_ids.network_security_group_id | default('') | length > 0
        fail_msg: >-
          Failed to resolve one or more NICO resource IDs for k0rdent-apis.
          tenant for org '{{ nico_api_org }}' via /tenant/current,
          ssh key group '{{ nico_prepovision_ssh_key_group_name }}' (available: {{
            nico_ids.ssh_key_group_available | default([]) | join(', ')
          }}),
          network security group '{{ nico_prepovision_network_security_group_name }}' (available: {{
            nico_ids.network_security_group_available | default([]) | join(', ')
          }}).
          Ensure platform-admin CRs have reconciled and name variables match.

    # Before the chart, so the worker starts with the CA Secret in place.
    - name: Deploy TLS gateway for the OIDC issuer
      ansible.builtin.include_tasks: tasks/k0rdent-apis-gateway-tls.yml
      when: k0rdent_apis_gateway_tls_enabled | bool

    - name: Render k0rdent-apis values overrides
      ansible.builtin.template:
        src: k0rdent-apis/values-socks-overrides.yaml.j2
        dest: "{{ k0rdent_apis_values_path }}"

    # Detects an issuer change, which needs the restarts below.
    - name: Read the issuer of the installed k0rdent-apis release
      ansible.builtin.command:
        cmd: >-
          helm --kubeconfig {{ kubeconfig_path }} -n {{ k0rdent_apis_namespace }}
          get values k0rdent-apis -o json
      register: k0rdent_apis_previous_values
      changed_when: false
      failed_when: false

    - name: Deploy/upgrade k0rdent-apis helm release
      kubernetes.core.helm:
        name: k0rdent-apis
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: "{{ k0rdent_apis_dir }}/deploy/helm/k0rdent-apis"
        release_namespace: "{{ k0rdent_apis_namespace }}"
        create_namespace: true
        values_files:
          - "{{ k0rdent_apis_dir }}/deploy/helm/k0rdent-apis/values-secret-kind.yaml"
          - "{{ k0rdent_apis_values_path }}"
        state: present
        wait: true
        wait_timeout: "{{ k0rdent_apis_helm_timeout }}"

    # The same fetches a workload API server makes, trusting only the lab CA.
    - name: Verify the OIDC issuer is served over TLS by the gateway
      when: k0rdent_apis_gateway_tls_enabled | bool
      block:
        # The discoveryURL the chart derives for region "local".
        - name: Fetch the issuer discovery document through the TLS gateway
          ansible.builtin.uri:
            url: "{{ k0rdent_apis_auth_issuer_url }}/v1/regions/local/auth/.well-known/openid-configuration"
            ca_path: "{{ k0rdent_apis_gateway_tls_pki_dir }}/ca.crt"
            return_content: true
          register: k0rdent_apis_issuer_discovery
          until: k0rdent_apis_issuer_discovery.status == 200
          retries: 30
          delay: 10

        - name: Fetch the issuer signing keys through the TLS gateway
          ansible.builtin.uri:
            url: "{{ k0rdent_apis_issuer_discovery.json.jwks_uri }}"
            ca_path: "{{ k0rdent_apis_gateway_tls_pki_dir }}/ca.crt"
          register: k0rdent_apis_issuer_jwks

        - name: Ensure discovery names the TLS gateway as issuer
          ansible.builtin.assert:
            that:
              - k0rdent_apis_issuer_discovery.json.issuer == k0rdent_apis_auth_issuer_url ~ '/realms/k0rdent'
            fail_msg: >-
              The issuer advertises {{ k0rdent_apis_issuer_discovery.json.issuer }},
              expected {{ k0rdent_apis_auth_issuer_url }}/realms/k0rdent.

    # Services and UIs (Atlas) cache tokens and discovery with the old issuer,
    # which Kong rejects with 401 ISSUER_NOT_ALLOWED until they expire.
    - name: Restart k0rdent-apis workloads after an issuer change
      when:
        - k0rdent_apis_previous_values.rc == 0
        - (k0rdent_apis_previous_values.stdout | from_json).global.authIssuerUrl | default('') != k0rdent_apis_auth_issuer_url
      block:
        - name: Restart every Deployment in {{ k0rdent_apis_namespace }}
          ansible.builtin.command:
            cmd: kubectl --kubeconfig {{ kubeconfig_path }} -n {{ k0rdent_apis_namespace }} rollout restart deployment

        - name: Wait for the restarted Deployments
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig {{ kubeconfig_path }} -n {{ k0rdent_apis_namespace }}
              rollout status deployment --timeout=10m
          changed_when: false

    # After the upgrade, so the worker no longer references the CA Secret. The
    # PKI directory is kept for re-enabling.
    - name: Remove the TLS gateway when it is disabled
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ k0rdent_apis_namespace }}"
        name: "{{ item.name }}"
        wait: true
      loop:
        - { api_version: apps/v1, kind: Deployment, name: k0rdent-apis-gateway-tls }
        - { api_version: v1, kind: Service, name: k0rdent-apis-gateway-tls }
        - { api_version: v1, kind: ConfigMap, name: k0rdent-apis-gateway-tls }
        - { api_version: v1, kind: Secret, name: "{{ k0rdent_apis_gateway_tls_secret }}" }
        - { api_version: v1, kind: Secret, name: "{{ k0rdent_apis_issuer_ca_secret }}" }
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      when: not (k0rdent_apis_gateway_tls_enabled | bool)

    - name: Deploy/upgrade k0rdent-kind-extras helm release
      kubernetes.core.helm:
        name: k0rdent-kind-extras
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: "{{ k0rdent_apis_dir }}/deploy/helm/k0rdent-kind-extras"
        release_namespace: "{{ k0rdent_apis_namespace }}"
        values:
          global:
            namespace: "{{ k0rdent_apis_namespace }}"
        state: present
        wait: true
        wait_timeout: "{{ k0rdent_apis_extras_helm_timeout }}"

    - name: Load provision-manifest content
      ansible.builtin.slurp:
        src: "{{ k0rdent_apis_dir }}/scripts/post-deploy/envs/{{ k0rdent_apis_provision_env }}/manifest.yaml"
      register: k0rdent_apis_provision_manifest

    - name: Ensure provision-manifest ConfigMap exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: provision-manifest
            namespace: "{{ k0rdent_apis_namespace }}"
          data:
            manifest.yaml: "{{ k0rdent_apis_provision_manifest.content | b64decode }}"

    - name: Ensure provision-manifest-secrets exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: provision-manifest-secrets
            namespace: "{{ k0rdent_apis_namespace }}"
          stringData:
            KIND_IDP_SECRET: unused-placeholder

    - name: Apply provision-apply job manifest
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        namespace: "{{ k0rdent_apis_namespace }}"
        src: "{{ k0rdent_apis_dir }}/deploy/k8s/k0r-tools/provision-apply.yaml"

    - name: Wait for provision-apply job to complete
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: batch/v1
        kind: Job
        namespace: "{{ k0rdent_apis_namespace }}"
        name: provision-apply
      register: k0rdent_apis_provision_job
      until: >-
        (k0rdent_apis_provision_job.resources[0].status.succeeded | default(0) | int) >= 1
        or (k0rdent_apis_provision_job.resources[0].status.failed | default(0) | int) >= 1
      retries: 60
      delay: 10

    - name: Fail if provision-apply did not succeed
      ansible.builtin.assert:
        that:
          - (k0rdent_apis_provision_job.resources[0].status.succeeded | default(0) | int) >= 1
        fail_msg: >-
          provision-apply job did not complete successfully.
          Check `kubectl -n {{ k0rdent_apis_namespace }} logs job/provision-apply`.

    - name: Stage nico-sync script
      ansible.builtin.copy:
        src: files/k0rdent-apis/nico-sync.sh
        dest: "{{ k0rdent_apis_nico_sync_path }}"
        mode: "0755"

    # k0r_token's cache may hold a token from an earlier issuer.
    - name: Drop the cached k0r CLI token
      ansible.builtin.file:
        path: /tmp/k0r-token
        state: absent

    - name: Sync NICO servers into k0rdent-apis
      ansible.builtin.command:
        cmd: bash "{{ k0rdent_apis_nico_sync_path }}"
      environment:
        BASE: "{{ k0rdent_apis_base_url }}"
        KUBECONFIG: "{{ kubeconfig_path }}"
        K0R_LOGIN_ORG: "{{ k0rdent_apis_provision_env }}"
        K0R_LOGIN_NAMESPACE: "{{ k0rdent_apis_namespace }}"
        NICO_HOST: "{{ nico_rest_external_ip }}"
        NICO_KEYCLOAK_BASE_URL: "{{ nico_keycloak_base_url }}"
        NICO_KEYCLOAK_REALM: "{{ nico_keycloak_realm }}"
        NICO_REST_API_BASE_URL: "{{ nico_api_base_url }}"
        NICO_CLIENT_ID: "{{ nico_client_id }}"
        NICO_CLIENT_SECRET: "{{ nico_client_secret }}"
        NICO_USERNAME: "{{ nico_api_username }}"
        NICO_PASSWORD: "{{ nico_api_password }}"
        NICO_ORG: "{{ nico_api_org }}"

    - name: Ensure HelmRepository for k0rdent-apis in kcm-system
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: HelmRepository
          metadata:
            name: k0rdent-apis
            namespace: kcm-system
            labels:
              k0rdent.mirantis.com/managed: "true"
          spec:
            type: oci
            interval: 30s
            provider: generic
            url: "{{ k0rdent_apis_helm_repo_url }}"
            secretRef:
              name: "{{ k0rdent_apis_pull_secret_name }}"

    - name: Ensure ClusterTemplate for NICO cluster in kcm-system
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: k0rdent.mirantis.com/v1beta1
          kind: ClusterTemplate
          metadata:
            name: "{{ k0rdent_apis_cluster_chart }}-{{ k0rdent_apis_cluster_chart_version | replace('.', '-') }}"
            namespace: kcm-system
            labels:
              k0rdent.mirantis.com/managed: "true"
          spec:
            helm:
              chartSpec:
                chart: "{{ k0rdent_apis_cluster_chart }}"
                version: "{{ k0rdent_apis_cluster_chart_version }}"
                interval: 30s
                reconcileStrategy: ChartVersion
                sourceRef:
                  kind: HelmRepository
                  name: k0rdent-apis

    - name: Wait for ClusterTemplate to be valid
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: k0rdent.mirantis.com/v1beta1
        kind: ClusterTemplate
        namespace: kcm-system
        name: "{{ k0rdent_apis_cluster_chart }}-{{ k0rdent_apis_cluster_chart_version | replace('.', '-') }}"
      register: k0rdent_apis_cluster_template_cr
      until: (k0rdent_apis_cluster_template_cr.resources[0].status.valid | default(false)) | bool
      retries: 30
      delay: 5

    - name: Ensure ClusterTemplateChain in kcm-system
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: k0rdent.mirantis.com/v1beta1
          kind: ClusterTemplateChain
          metadata:
            name: "ctc-{{ k0rdent_apis_cluster_chart }}-{{ k0rdent_apis_cluster_chart_version | replace('.', '-') }}"
            namespace: kcm-system
            labels:
              app.k0rdent.ai/managed: "true"
          spec:
            supportedTemplates:
              - name: "{{ k0rdent_apis_cluster_chart }}-{{ k0rdent_apis_cluster_chart_version | replace('.', '-') }}"

    - name: Ensure AccessManagement to fan out ClusterTemplateChain into project namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: k0rdent.mirantis.com/v1beta1
          kind: AccessManagement
          metadata:
            name: kcm
          spec:
            accessRules:
              - clusterTemplateChains:
                  - "ctc-{{ k0rdent_apis_cluster_chart }}-{{ k0rdent_apis_cluster_chart_version | replace('.', '-') }}"
                targetNamespaces:
                  selector:
                    matchLabels:
                      app.k0rdent.ai/project-namespace: "true"
