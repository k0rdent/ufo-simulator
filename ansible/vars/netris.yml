sdn_provider: netris
ufo_fabric_backend: 'netris'
switch_port_name_prefix: "swp"
br_mgmt_phys_interface: ens5
br_ext_phys_interface: "ens4"
# Match br-mgmt DHCP DNS so PXE-booted hosts resolve the same way.
pxe_dns_server: "{{ management_dns_server }}"

# eth1-4: north-south rails; eth5-8: one NIC per ew-leaf (all 4 ew-leafs).
vm_port_count: 8

# East-west leaf-spine fabric. Each VM connects to every ew-leaf (eth5→ew-leaf-0,
# eth6→ew-leaf-1, eth7→ew-leaf-2, eth8→ew-leaf-3), mirroring how vm-0..10
# attach to leaf-0 on eth1. ew-leafs uplink to ew-spines like leaf-0/1 → spine-0/1.
topology_ew:
  spines:
    - name: ew-spine-0
      mgmt_ip: 10.200.0.130
    - name: ew-spine-1
      mgmt_ip: 10.200.0.131
  leafs:
    - name: ew-leaf-0
      mgmt_ip: 10.200.0.120
    - name: ew-leaf-1
      mgmt_ip: 10.200.0.121
    - name: ew-leaf-2
      mgmt_ip: 10.200.0.122
    - name: ew-leaf-3
      mgmt_ip: 10.200.0.123
  links:
    # VM → ew-leaf (each VM on eth5..eth8 to all four ew-leafs)
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-0", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth5", role: "ew1" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-1", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth6", role: "ew2" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-2", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth7", role: "ew3" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth8", role: "ew4" }
    - { local: "ew-leaf-3", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth8", role: "ew4" }

    # ew-leaf ↔ ew-spine (same pattern as leaf-0/1 ↔ spine-0/1)
    - { local: "ew-spine-0", local_port: "{{ switch_port_name_prefix }}1", remote: "ew-leaf-0", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "ew-spine-0", local_port: "{{ switch_port_name_prefix }}2", remote: "ew-leaf-1", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "ew-spine-0", local_port: "{{ switch_port_name_prefix }}3", remote: "ew-leaf-2", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "ew-spine-0", local_port: "{{ switch_port_name_prefix }}4", remote: "ew-leaf-3", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "ew-spine-1", local_port: "{{ switch_port_name_prefix }}1", remote: "ew-leaf-0", remote_port: "{{ switch_port_name_prefix }}28" }
    - { local: "ew-spine-1", local_port: "{{ switch_port_name_prefix }}2", remote: "ew-leaf-1", remote_port: "{{ switch_port_name_prefix }}28" }
    - { local: "ew-spine-1", local_port: "{{ switch_port_name_prefix }}3", remote: "ew-leaf-2", remote_port: "{{ switch_port_name_prefix }}28" }
    - { local: "ew-spine-1", local_port: "{{ switch_port_name_prefix }}4", remote: "ew-leaf-3", remote_port: "{{ switch_port_name_prefix }}28" }
