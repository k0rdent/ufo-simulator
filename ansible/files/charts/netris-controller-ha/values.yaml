# Default values for netris-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

argocd:
  enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

postUpgradeCleanup:
  # Enable post-upgrade hook to cleanup old Graphite resources when upgrading from 4.9 to 4.10
  enabled: true
  # Delete Graphite PVCs (persistent volumes). Set to false to keep data for backup/audit.
  # Ignored (always false) when migrateGraphiteData is true — PVCs must stay for the migration job.
  deletePVCs: false
  # Migrate historical metrics from Graphite Whisper PVCs into VictoriaMetrics (vminsert).
  # Enable this when upgrading from 4.9.0 to 4.10.0 to preserve old telemetry data.
  # A post-upgrade Job will read all .wsp files from the Graphite pod-0 PVC and replay them
  # into vminsert via the graphite plaintext protocol on port 2003.
  # After verifying the migration succeeded, you can delete the old PVCs manually:
  #   kubectl delete pvc <release>-graphite-pvc-<release>-graphite-{0,1,2} -n <namespace>
  migrateGraphiteData: true
  # Override the Graphite pod-0 PVC name if it differs from the auto-computed default.
  # Default: <release>-graphite-pvc-<release>-graphite-0
  graphitePVCName: ""
  graphiteExists: false

# ClusterRoleBinding granting the cleanup job access; runs first (lower sync-wave)
# so the RBAC exists before the pre-upgrade-cleanup job below runs.
post-upgrade-rbac:
  annotations:
    argocd:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/sync-wave: "-10"
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
    helm:
      helm.sh/hook: pre-upgrade
      helm.sh/hook-weight: "-10"
      helm.sh/hook-delete-policy: hook-succeeded

# Job that cleans up old Graphite resources; runs after post-upgrade-rbac (higher sync-wave).
pre-upgrade-cleanup:
  annotations:
    argocd:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/sync-wave: "1"
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
    helm:
      helm.sh/hook: pre-upgrade
      helm.sh/hook-weight: "1"
      helm.sh/hook-delete-policy: hook-succeeded


