## Using default values from https://github.com/bitnami/charts/tree/master/bitnami/mariadb/values.yaml
## Auth from existing secret not supported at the moment
mariadb:
  auth:
    database: netris
    username: netris
    password: changeme
    rootPassword: changeme
  # initdbScriptsConfigMap: netris-controller-initdb
  # MIRANTIS PATCH (see PATCHES.md): replicas/backupCount/storage.size were hardcoded
  # in templates/mariadb-crs.yaml. Defaults below reproduce the upstream values.
  # Set replicas to 1 for a single-node lab; the replication block is then omitted.
  replicas: 3
  backupCount: 3
  storage:
    size: 10Gi


## MIRANTIS PATCH (see PATCHES.md): MaxScale replicas were hardcoded in
## templates/mariadb-crs.yaml. Default below reproduces the upstream value.
maxscale:
  replicas: 3


## Using default values from https://github.com/bitnami/charts/tree/master/bitnami/mongodb/values.yaml
## Auth from existing secret not supported at the moment
mongodb:
  resourcesPreset: large
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    repository: netrisai/mongodb
    tag: ctl-4.6.1
  architecture: replicaset
  replicaCount: 3
  arbiter:
    enabled: false
  auth:
    database: netris
    username: netris
    password: changeme
    rootPassword: changeme
  initdbScriptsConfigMap: netris-controller-initdb-mongodb


## Using default values from https://github.com/bitnami/charts/tree/master/bitnami/redis/values.yaml
redis:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    repository: netrisai/redis
    tag: ctl-4.6.1
  architecture: replication
  sentinel:
    resourcesPreset: small
    image:
      repository: netrisai/redis-sentinel
      tag: ctl-4.6.1
    enabled: true
    downAfterMilliseconds: 15000
    failoverTimeout: 60000
    persistence:
      enabled: true
      size: 1Gi
  auth:
    enabled: false
    sentinel: false
  replica:
    replicaCount: 3
    resourcesPreset: large
    disableCommands: []
  commonConfiguration: |-
    appendonly no
    save "900 1 300 10 60 10000"

mariadb-operator:
  ha:
    enabled: true
    replicas: 3
  pdb:
    enabled: true
    maxUnavailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: "kubernetes.io/hostname"
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - mariadb-operator
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - mariadb-operator


  certController:
    ha:
      enabled: true
      replicas: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - mariadb-operator-cert-controller
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - mariadb-operator-cert-controller


  webhook:
    ha:
      enabled: true
      replicas: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - mariadb-operator-webhook
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - mariadb-operator-webhook


## Using default values from https://github.com/ntppool/charts/tree/main/charts/smtp/values.yaml
smtp:
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 128Mi
  config:
    # MAILNAME: smtp
    DISABLE_IPV6: "1"
    RELAY_NETWORKS: ":172.16.0.0/12:10.0.0.0/8:192.168.0.0/16"
    # SMARTHOST_ADDRESS: mail.example.com
    # SMARTHOST_PORT: "587"
    # SMARTHOST_USER: myuser
    # SMARTHOST_PASSWORD: secret
    # SMARTHOST_ALIASES: "*.example.com"


victoriametrics:
  enabled: true

victoria-metrics-cluster:
  nameOverride: "vmc"

  vminsert:
    strategy:
      rollingUpdate:
        maxUnavailable: 1
    replicaCount: 3
    extraArgs:
      graphiteListenAddr: ":2003"
      loggerLevel: "INFO"
      loggerFormat: "json"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - vminsert
          topologyKey: kubernetes.io/hostname

  vmstorage:
    replicaCount: 3
    retentionPeriod: 6
    persistentVolume:
      enabled: true
      size: 100Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - vmstorage
          topologyKey: kubernetes.io/hostname

  vmselect:
    replicaCount: 3
    cacheMountPath: /select-cache
    mode: statefulSet
    persistentVolume:
      enabled: true
      size: 2Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - vmselect
          topologyKey: kubernetes.io/hostname
