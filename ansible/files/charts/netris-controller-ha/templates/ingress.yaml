---
{{- if .Values.ingress.enabled -}}
{{- $fullName := printf "%s-%s" (include "netris-controller.fullname" .) "web-service-frontend" -}}
{{- $fullNameBk := printf "%s-%s" (include "netris-controller.fullname" .) "web-service-backend" -}}
{{- $servicePort := (index .Values "web-service-frontend").service.port -}}
{{- $servicePortBk := (index .Values "web-service-backend").service.port -}}
{{- $ingressPath := .Values.ingress.path -}}
{{- $ingressPathType := .Values.ingress.pathType -}}
{{- $newAPI := .Capabilities.APIVersions.Has "networking.k8s.io/v1/Ingress" -}}
{{- if $newAPI -}}
apiVersion: networking.k8s.io/v1
{{- else if .Capabilities.APIVersions.Has "networking.k8s.io/v1beta1/Ingress" }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "netris-controller.labels" . | nindent 4 }}
    {{- printf "%s-%s" (include "netris-controller.selectorLabels" .) "web-service-frontend" | nindent 4 }}
{{- if .Values.ingress.labels }}
{{ toYaml .Values.ingress.labels | indent 4 }}
{{- end }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-compress-middleware@kubernetescrd
  {{- if .Values.ingress.annotations }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ tpl $value $ | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end -}}
{{- if .Values.ingress.tls }}
  tls:
{{ tpl (toYaml .Values.ingress.tls) $ | indent 4 }}
{{- end }}
  rules:
  {{- if .Values.ingress.hosts  }}
  {{- range .Values.ingress.hosts }}
    - host: {{ tpl . $}}
      http:
        paths:
          - path: {{ $ingressPath }}
            {{- if $newAPI }}
            pathType: {{ $ingressPathType }}
            {{- end }}
            backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
          - path: {{ printf "%s%s" $ingressPath "api" }}
            {{- if $newAPI }}
            pathType: {{ $ingressPathType }}
            {{- end }}
            backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullNameBk }}
                port:
                  number: {{ $servicePortBk }}
              {{- else }}
              serviceName: {{ $fullNameBk }}
              servicePort: {{ $servicePortBk }}
              {{- end }}
          - path: {{ printf "%s%s" $ingressPath "socket.io" }}
            {{- if $newAPI }}
            pathType: {{ $ingressPathType }}
            {{- end }}
            backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullNameBk }}
                port:
                  number: {{ $servicePortBk }}
              {{- else }}
              serviceName: {{ $fullNameBk }}
              servicePort: {{ $servicePortBk }}
              {{- end }}
  {{- end }}
  {{- else }}
    - http:
        paths:
          - backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $servicePort }}
            pathType: {{ $ingressPathType }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $servicePort }}
              {{- end }}
          {{- if $ingressPath }}
            path: {{ $ingressPath }}
            {{- end }}
          - backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullNameBk }}
                port:
                  number: {{ $servicePortBk }}
            pathType: {{ $ingressPathType }}
              {{- else }}
              serviceName: {{ $fullNameBk }}
              servicePort: {{ $servicePortBk }}
              {{- end }}
          {{- if $ingressPath }}
            path: {{ printf "%s%s" $ingressPath "api" }}
            {{- end }}
          - backend:
              {{- if $newAPI }}
              service:
                name: {{ $fullNameBk }}
                port:
                  number: {{ $servicePortBk }}
            pathType: {{ $ingressPathType }}
              {{- else }}
              serviceName: {{ $fullNameBk }}
              servicePort: {{ $servicePortBk }}
              {{- end }}
          {{- if $ingressPath }}
            path: {{ printf "%s%s" $ingressPath "socket.io" }}
            {{- end }}
  {{- end -}}
{{- end }}
