{{- $graphiteExists := .Values.postUpgradeCleanup.graphiteExists }}
{{- if not (default false .Values.argocd.enabled) }}
{{- $graphiteSts := lookup "apps/v1" "StatefulSet" .Release.Namespace (printf "%s-graphite" .Release.Name) }}
{{- $graphiteExists = gt (len $graphiteSts) 0 }}
{{- end }}
{{- if and .Values.postUpgradeCleanup.enabled $graphiteExists }}
{{- $graphiteFullname := printf "%s-graphite" .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "netris-controller.fullname" . }}-post-upgrade-rbac
  labels:
    {{- include "netris-controller.labels" . | nindent 4 }}
  annotations:
    {{- include "netris-controller.hookAnnotations" (dict "root" . "annotations" (index .Values "post-upgrade-rbac" "annotations")) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ include "netris-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "netris-controller.fullname" . }}-pre-upgrade-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netris-controller.labels" . | nindent 4 }}
  annotations:
    {{- include "netris-controller.hookAnnotations" (dict "root" . "annotations" (index .Values "pre-upgrade-cleanup" "annotations")) | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "netris-controller.labels" . | nindent 8 }}
    spec:
      serviceAccountName: netris-controller-ha
      containers:
      - name: cleanup
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting pre-upgrade cleanup..."
          echo "Waiting for VictoriaMetrics to be ready..."

          # Wait for vminsert to be ready (if it exists)
          kubectl get statefulset {{ include "netris-controller.fullname" . }}-vmc-vminsert -n {{ .Release.Namespace }} 2>/dev/null && \
            kubectl rollout status statefulset/{{ include "netris-controller.fullname" . }}-vmc-vminsert -n {{ .Release.Namespace }} --timeout=300s || true

          # Wait for vmstorage to be ready (if it exists)
          kubectl get statefulset {{ include "netris-controller.fullname" . }}-vmc-vmstorage -n {{ .Release.Namespace }} 2>/dev/null && \
            kubectl rollout status statefulset/{{ include "netris-controller.fullname" . }}-vmc-vmstorage -n {{ .Release.Namespace }} --timeout=300s || true

          # Wait for vmselect to be ready (if it exists)
          kubectl get statefulset {{ include "netris-controller.fullname" . }}-vmc-vmselect -n {{ .Release.Namespace }} 2>/dev/null && \
            kubectl rollout status statefulset/{{ include "netris-controller.fullname" . }}-vmc-vmselect -n {{ .Release.Namespace }} --timeout=300s || true

          echo "VictoriaMetrics is ready. Cleaning up old Graphite resources..."

          echo "Deleting Graphite StatefulSet..."
          kubectl delete statefulset {{ include "netris-controller.fullname" . }}-graphite \
            -n {{ .Release.Namespace }} --ignore-not-found=true

          echo "Deleting Graphite services..."
          kubectl delete svc {{ include "netris-controller.fullname" . }}-graphite \
            -n {{ .Release.Namespace }} --ignore-not-found=true
          kubectl delete svc {{ include "netris-controller.fullname" . }}-graphite-headless \
            -n {{ .Release.Namespace }} --ignore-not-found=true

          echo "Deleting Graphite ConfigMaps..."
          kubectl delete cm -l app.kubernetes.io/name=graphite \
            -n {{ .Release.Namespace }} --ignore-not-found=true

          {{- if and .Values.postUpgradeCleanup.deletePVCs (not .Values.postUpgradeCleanup.migrateGraphiteData) }}
          echo "Deleting Graphite PVCs..."
          kubectl delete pvc -l app.kubernetes.io/name=graphite \
            -n {{ .Release.Namespace }} --ignore-not-found=true
          echo "Graphite PVCs deleted"
          {{- else if .Values.postUpgradeCleanup.migrateGraphiteData }}
          echo "Skipping PVC deletion (PVCs will be read by the post-upgrade graphite-vm-migration job)"
          {{- else }}
          echo "Skipping PVC deletion (postUpgradeCleanup.deletePVCs is disabled)"
          {{- end }}

          echo "Pre-upgrade cleanup complete!"
          echo "Job will self-delete in 10 seconds..."
          sleep 10
      restartPolicy: Never
  backoffLimit: 1
{{- end }}
