apiVersion: v1
data:
  mariadb-root-password: {{ .Values.mariadb.auth.rootPassword | b64enc | quote }}
  mariadb-password: {{ .Values.mariadb.auth.password | b64enc | quote }}
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb" }}
type: Opaque
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha" }}
spec:
  rootPasswordSecretKeyRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb" }}
    key: mariadb-root-password
  database: {{ .Values.mariadb.auth.database }}
  storage:
    size: {{ .Values.mariadb.storage.size | default "10Gi" }}
  image: docker-registry1.mariadb.com/library/mariadb:10.11.16
  replicas: {{ .Values.mariadb.replicas | default 3 }}
  {{- if gt (int (.Values.mariadb.replicas | default 3)) 1 }}
  replication:
    enabled: true
    syncBinlog: 1
  {{- end }}
  myCnf: |
    [mariadb]
    event_scheduler=ON
    max_connections=1500
    log_bin_trust_function_creators=1
    innodb_log_file_size = 256M
    innodb_buffer_pool_size = 2G
    tmp_table_size = 256MB
    max_heap_table_size = 256MB
    query_cache_type = ON
    query_cache_size = 128M
    query_cache_limit = 4M
    thread_cache_size = 512
    table_open_cache = 8000
    table_definition_cache = 2000
    join_buffer_size = 8M
    sort_buffer_size = 2M
    read_buffer_size = 2M
  myCnfConfigMapKeyRef:
    name: mariadb
    key: my.cnf
  maxScaleRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb" }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha-user-all" }}
spec:
  database: {{ .Values.mariadb.auth.database }}
  grantOption: false
  host: '%'
  mariaDbRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha" }}
  privileges:
  - ALL PRIVILEGES
  table: '*'
  username: {{ .Values.mariadb.auth.username }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha-user" }}
spec:
  host: '%'
  mariaDbRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha" }}
  maxUserConnections: 1400
  name: {{ .Values.mariadb.auth.username }}
  passwordSecretKeyRef:
    key: mariadb-password
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb" }}

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb" }}
spec:
  mariaDbRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" .) "mariadb-ha" }}
  replicas: {{ .Values.maxscale.replicas | default 3 }}
  services:
  - listener:
      name: rw-router-listener
      port: 3306
      protocol: MariaDBProtocol
      suspend: false
    name: rw-router
    params:
      master_accept_reads: "true"
      transaction_replay: "true"
      max_replication_lag: "2s"
    router: readwritesplit
    suspend: false
---
