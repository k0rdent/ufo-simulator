{{- $dot := . }}
{{- range $index := until (int ($dot.Values.mariadb.backupCount | default 3)) }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: {{ printf "%s-%s%d" (include "netris-controller.fullname" $dot) "mariadb-backup" (add1 $index) }}
spec:
  mariaDbRef:
    name: {{ printf "%s-%s" (include "netris-controller.fullname" $dot) "mariadb-ha" }}
  databases:
    - {{ $dot.Values.mariadb.auth.database }}
  schedule:
    cron: "0 */12 * * *"
  storage:
    persistentVolumeClaim:
      resources:
        requests:
          storage: 20Gi
      accessModes:
        - ReadWriteOnce
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: mariadb-backup
        topologyKey: kubernetes.io/hostname
  podMetadata:
    labels:
      app: mariadb-backup
{{- end }}
