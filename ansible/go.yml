---
- name: Install Go toolchain
  hosts: cmps
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ sdn_provider }}.yml

  vars:
    # Pinned to match the GO_VERSION build arg in
    # k0rdent-apis/build/Dockerfile.go-service so `go run` on the CMP builds
    # against the same toolchain the images do. Bump both together.
    go_version: "1.26.3"
    go_root: /usr/local/go
    go_arch_map:
      x86_64: amd64
      aarch64: arm64
    go_arch: "{{ go_arch_map[ansible_architecture] }}"
    go_tarball_url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"

  tasks:
    - name: Check installed Go version
      ansible.builtin.command: "{{ go_root }}/bin/go version"
      register: go_current
      failed_when: false
      changed_when: false

    - name: Refresh Go toolchain
      when: "'go' + go_version not in (go_current.stdout | default(''))"
      block:
        - name: Remove any previous Go install
          ansible.builtin.file:
            path: "{{ go_root }}"
            state: absent

        - name: Download and unpack Go
          ansible.builtin.unarchive:
            src: "{{ go_tarball_url }}"
            dest: /usr/local
            remote_src: true
            creates: "{{ go_root }}/bin/go"

    - name: Symlink go binaries into /usr/local/bin
      ansible.builtin.file:
        src: "{{ go_root }}/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - go
        - gofmt

    - name: Verify installation
      ansible.builtin.command: /usr/local/bin/go version
      register: go_installed
      changed_when: false

    - name: Show Go version
      ansible.builtin.debug:
        msg: "{{ go_installed.stdout }}"
