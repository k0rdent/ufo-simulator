# Virtual Switch Lab Configuration
# Adjust these values based on your available RAM
#
artifacts_dir: "{{ playbook_dir }}/artifacts"
k8s_artifacts_dir: "{{ artifacts_dir }}/k8s"

# Base images
#
# Cumulus VX, pinned per fabric backend because 5.15.0 renamed NVUE paths that
# both controllers drive:
#   service ntp <vrf> server        -> system ntp server
#   interface <id> ip address       -> interface <id> ipv4 address
#   interface <id> ip ipv6 state    -> interface <id> ipv6 state
# The image and the controller have to agree: one emitting the old spelling gets
# a 400 from a switch expecting the new one, and the reverse fails the same way.
#
# Verity emits the 5.15 spelling, so it needs 5.15. The Netris agent does not:
# get-netris.sh --lo writes the loopback through the old `interface lo ip
# address` path, which silently does nothing on 5.15, and the agent then exits
# with "Cannot determine loopback ip address" because nothing ever configured
# lo. Netris stays on 5.11 until its agent moves.
#
# The filename carries the version, so a bump downloads to a new path and leaves
# the old image in place. Per-switch CoW disks are guarded by `creates:` on their
# own name, so they keep the old backing file until destroy-switches.yml runs:
# bumping this without recreating the switches changes nothing.
cumulus_version: "{{ '5.11.1' if (ufo_fabric_backend | default(sdn_provider)) == 'netris' else '5.15.0' }}"
cumulus_image_name: "cumulus-linux-{{ cumulus_version }}-vx-amd64-qemu.qcow2"
cumulus_image: "/var/lib/libvirt/images/{{ cumulus_image_name }}"
cumulus_image_url: "https://networkingdownloads.nvidia.com/custhelp/Non_Monetized_Products/Software/CumulusSoftware/CumulusVX/{{ cumulus_image_name }}"
ubuntu_image: "/var/lib/libvirt/images/ubuntu-24.04-server-cloudimg-amd64.img"
vm_disk_path: "/var/lib/libvirt/images"

# VM Resources
switch_vcpus: 4
switch_memory_mb: 6192
server_vcpus: 2
server_memory_mb: 4096

# Management network - SSH access to VMs via port forwarding
mgmt_ssh_base_port: 2200  # leaf-0 = 2200, leaf-1 = 2201, etc.

# UDP tunnel base port for inter-switch links
udp_base_port: 10000

# Every switch runs Cumulus, under both backends. Netris requires it, and Verity
# serves the switches' DHCP and configures them over ZTP itself, so it does not
# care what the NOS is. Cumulus names ports swpN, and swpNsX once a port is
# broken out; that naming is what expand_switch_port_nics and the breakout
# helpers in topology.py produce.
switch_port_name_prefix: "swp"

# Topology Definition
# Simple leaf-spine topology for testing
topology:
  north_south:
    fabric_type: bridge
    bridge_name: br-pxe
  spines:
    - name: spine-0
      mgmt_ip: 10.200.0.110
    - name: spine-1
      mgmt_ip: 10.200.0.111
  leafs:
    # NS leaves: UFO Switch type north-south (webhook rejects rail/pod/su topology).
    - name: leaf-0
      mgmt_ip: 10.200.0.100
      type: north-south
    - name: leaf-1
      mgmt_ip: 10.200.0.101
      type: north-south
    - name: ext-leaf-0
      mgmt_ip: 10.200.0.102
    - name: ext-leaf-1
      mgmt_ip: 10.200.0.103
  nodes:
    - name: vm-0
      host_id: 0
    - name: vm-1
      host_id: 1
    - name: vm-2
      host_id: 2
    - name: vm-3
      host_id: 3
    - name: vm-4
      host_id: 4
    - name: vm-5
      host_id: 5
    - name: vm-6
      host_id: 6
    - name: vm-7
      host_id: 7
    - name: vm-8
      host_id: 8
    - name: vm-9
      host_id: 9
    # 9 is maximum need to fix templates to support more
  softgates:
    - name: sg-0
      role: general
    - name: sg-1
      role: snat

  # Links format: [local_switch, local_port, remote_switch, remote_port]
  # Each link will get a unique UDP port pair
  links:
    # NS leaf↔VM: no rail_id (north-south Switch CRs must not carry rail topology).
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth1", role: "ns" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth1", role: "ns" }

    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}1", remote: "vm-0", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}2", remote: "vm-1", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}3", remote: "vm-2", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}4", remote: "vm-3", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}5", remote: "vm-4", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}6", remote: "vm-5", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}7", remote: "vm-6", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}8", remote: "vm-7", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}9", remote: "vm-8", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}10", remote: "vm-9", remote_port: "eth2", role: "ns" }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}11", remote: "vm-10", remote_port: "eth2", role: "ns" }

    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}23", remote: "sg-0", remote_port: "eth1", role: ext }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}23", remote: "sg-0", remote_port: "eth2", role: ext }
 
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}24", remote: "sg-1", remote_port: "eth1", role: ext }
    - { local: "leaf-1", local_port: "{{ switch_port_name_prefix }}24", remote: "sg-1", remote_port: "eth2", role: ext }

    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}25", remote: "leaf-1", remote_port: "{{ switch_port_name_prefix }}25" }
    - { local: "leaf-0", local_port: "{{ switch_port_name_prefix }}26", remote: "leaf-1", remote_port: "{{ switch_port_name_prefix }}26" }

    - { local: "spine-0", local_port: "{{ switch_port_name_prefix }}1", remote: "leaf-0", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "spine-0", local_port: "{{ switch_port_name_prefix }}2", remote: "leaf-1", remote_port: "{{ switch_port_name_prefix }}27" }
    - { local: "spine-1", local_port: "{{ switch_port_name_prefix }}1", remote: "leaf-0", remote_port: "{{ switch_port_name_prefix }}28" }
    - { local: "spine-1", local_port: "{{ switch_port_name_prefix }}2", remote: "leaf-1", remote_port: "{{ switch_port_name_prefix }}28" }
    - { local: "spine-0", local_port: "{{ switch_port_name_prefix }}3", remote: "ext-leaf-0", remote_port: "{{ switch_port_name_prefix }}1" }
    - { local: "spine-0", local_port: "{{ switch_port_name_prefix }}4", remote: "ext-leaf-1", remote_port: "{{ switch_port_name_prefix }}1" }
    - { local: "spine-1", local_port: "{{ switch_port_name_prefix }}3", remote: "ext-leaf-0", remote_port: "{{ switch_port_name_prefix }}2" }
    - { local: "spine-1", local_port: "{{ switch_port_name_prefix }}4", remote: "ext-leaf-1", remote_port: "{{ switch_port_name_prefix }}2" }

# East-west leaf-spine fabric (shared by netris and verity). Each VM connects to
# every ew-leaf (eth5→ew-leaf-0 … eth12→ew-leaf-7). Leaf→server ports use 2-way
# breakouts, assigned sequentially: vm-0 -> swp1s0, vm-1 -> swp1s1,
# vm-2 -> swp2s0, and so on.
# Netris Switch CR create-time breakout for all EW switches (2 ports per physical port).
ew_switch_breakout: "2x100"
topology_ew:
  spines:
    - name: ew-spine-0
      mgmt_ip: 10.200.0.130
    - name: ew-spine-1
      mgmt_ip: 10.200.0.131
  leafs:
    # EW leaves: spectrum-x with rail_id (rail topology allowed only on this type).
    - name: ew-leaf-0
      mgmt_ip: 10.200.0.120
      type: spectrum-x
      su_id: 0
      rail_id: 0
    - name: ew-leaf-1
      mgmt_ip: 10.200.0.121
      type: spectrum-x
      su_id: 0
      rail_id: 1
    - name: ew-leaf-2
      mgmt_ip: 10.200.0.122
      type: spectrum-x
      su_id: 0
      rail_id: 2
    - name: ew-leaf-3
      mgmt_ip: 10.200.0.123
      type: spectrum-x
      su_id: 0
      rail_id: 3
    - name: ew-leaf-4
      mgmt_ip: 10.200.0.124
      type: spectrum-x
      su_id: 0
      rail_id: 4
    - name: ew-leaf-5
      mgmt_ip: 10.200.0.125
      type: spectrum-x
      su_id: 0
      rail_id: 5
    - name: ew-leaf-6
      mgmt_ip: 10.200.0.126
      type: spectrum-x
      su_id: 0
      rail_id: 6
    - name: ew-leaf-7
      mgmt_ip: 10.200.0.127
      type: spectrum-x
      su_id: 0
      rail_id: 7

# Spines the Spectrum-X fabric *declares*, which is 4 per scalable unit. Port
# numbering is absolute, so this must match the controller's fabric settings
# (Max SUs 1 -> 4 spines) even when fewer spine VMs are built: each spine-leaf
# pair then gets 64/4 = 16 uplink subports, and both sides derive the same /31
# per link. Raising Max SUs raises the declared spine count and shrinks the
# per-pair block (8 spines -> 8 links, 64 spines -> 1, the full-scale
# reference). See ew_fabric_links.
ew_declared_spines: 4

# How many of each pair's 16-subport block to actually wire. The links are ECMP
# members, so one is enough to exercise the path, the /31 and the BGP session;
# the rest only add width. Wired links keep their blueprint numbering -- leaf 0
# still meets spine 0 at swp33s0/swp1s0 and leaf 1 at swp33s0/swp9s0 -- so their
# addresses match the controller exactly. The unwired members show as missing
# connections, like the spines the lab does not build.
#
# This does not change VM size: the NIC grid still has to span swp57, where leaf
# 7's block starts, so a spine is 128 NICs either way. It changes how many of
# them carry a live tunnel (8 per spine here, 128 at the full 16).
ew_links_per_pair: 1

# EW leaf→VM (2-way breakout) + leaf↔spine fabric links.
topology_ew_links: >-
  {{ (topology_ew.leafs | ew_breakout_server_links(topology.nodes, switch_port_name_prefix))
     + (topology_ew.spines | ew_fabric_links(topology_ew.leafs, switch_port_name_prefix,
                                             declared_spines=ew_declared_spines,
                                             links_per_pair=ew_links_per_pair)) }}

# Aggregates used by create/configure/destroy playbooks and link wiring.
# all_topology_links renumbers non-breakout switch-side ports to match Cumulus
# NIC order (local links first, then remote — same as create-switch-vm.yml).
# Breakout names (e.g. swp1s0) are preserved.
all_topology_switches: "{{ topology.spines + topology.leafs + topology_ew.spines + topology_ew.leafs }}"
# Names of every spine (NS + EW); everything else in all_topology_switches is a leaf.
all_topology_spine_names: "{{ (topology.spines + topology_ew.spines) | map(attribute='name') | list }}"
all_topology_links: "{{ (topology.links + topology_ew_links) | resolve_topology_link_ports(all_topology_switches, switch_port_name_prefix) }}"

# Highest ethN on any VM link (covers NS + EW). Used for Netris portsCount and MAC offsets.
vm_port_count: "{{ ((topology.links + topology_ew_links) | selectattr('remote', 'match', '^vm-') | map(attribute='remote_port') | map('regex_replace', '^eth', '') | map('int') | list | max) | default(4) | int }}"

# Cumulus default credentials
cumulus_user: cumulus
cumulus_default_password: cumulus
cumulus_new_password: password

redfish_username: admin
redfish_password: password

vm_base_mac: "52:54:00:12"
bridge_name: br-mgmt
vm_vcpus: 6
vm_ram: 6144
vm_disk_size: 60
disk_path: /var/lib/libvirt/images

sg_base_mac: "52:54:00:13"
# Mgmt NIC (eth0) OUI for north-south switches vs east-west switches.
switch_base_mac: "00:01:00:00"
ew_switch_base_mac: "00:01:00:01"
# Data-plane NIC MAC bases (libvirt + rename-swp.service for port-grid names).
# Final MAC: <base>:<switch_idx>:<nic_idx>  e.g. 52:54:00:21:00:01
switch_data_mac_base: "52:54:00:20"
ew_switch_data_mac_base: "52:54:00:21"
# Physical ports per leaf/spine VM (Netris portsCount). EW breakout 2x → 2 NICs/port.
switch_ports_count: 48

# EW switches model a 64-port Spectrum-X: 64 physical x 2 lanes = 128 NICs.
# A spine alone needs 128 wired NICs at ew_links_per_pair 16 (16 x 8 leaves),
# and a leaf fills ports 33-64 with uplinks, so 48 ports is not enough here.
ew_switch_ports_count: 64

switch_stub_udp_base: 40000

sg_port_count: 2
sg_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
sg_image: "/var/lib/libvirt/images/noble-server-cloudimg-amd64.img"
sg_disk_size: 60

netris_auth_token: <token from webapi>
netris_admin_username: netris
netris_admin_password: password
netris_license: ""
# The netris_operator_* pins live in ansible/vars/artifacts-*.yaml (selected by
# artifacts_vars_file), which every netris playbook loads via vars_files.

loopback_base: "192.169"
management_base: "192.168"
loopback_base_switch: "192.169.0"
management_base_switch: "10.200.0"
management_gateway_switch: "{{ management_base_switch }}.254"

# Verity keeps switch OOB and its own tooling on separate ranges that share the
# br-mgmt L2 and differ only by CIDR, so the gtw routes between them: the
# container Verity starts at 10.200.2.N drives the switch at 10.200.1.N. The
# split is what keeps the leaves out of 10.200.0.0/24, where the lab services
# live.
#
# 10.200.1.254 is not ours to choose. Verity writes
#   nv set vrf mgmt router static default via 10.200.1.254
# into every leaf's mgmt VRF, so that address must exist on the wire or no
# switch has a default route. Change it here only if it changes in Verity too.
management_base_verity_switch: "10.200.1"
management_gateway_verity_switch: "{{ management_base_verity_switch }}.254"
management_base_verity_controller: "10.200.2"
management_gateway_verity_controller: "{{ management_base_verity_controller }}.254"

loopback_base_server: "192.169.1"
management_base_server: "192.168.1"
management_gateway_server: "{{ management_base_server }}.254"

loopback_base_sg: "192.169.2"
management_base_sg: "192.168.2"
management_gateway_sg: "{{ management_base_sg }}.254"
management_dns_server: 4.2.2.1

ext_base: 192.167
ext_base_sg: 192.167.2
ext_base_gateway_sg: "{{ ext_base_sg }}.254"
ext_sg_netmask: 24
ext_nat: "{{ ext_base_sg }}.0"

ext_base_switch: "{{ ext_base }}.3"
ext_base_gateway_switch_gtw: "{{ ext_base_switch }}.1"
ext_base_gateway_switch: "{{ ext_base_switch }}.254"
fabric_gateway_ip: "{{ ext_base_switch }}.100"

child_public_cidr: 192.167.100.0/24

pxe_base: 172.16.81

br_pxe_name: br-pxe
br_pxe_ip: 172.16.81.254
br_pxe_netmask: 24
br_pxe_phys_interface: ""
# DNS offered on PXE DHCP (same global DNS as br-mgmt).
pxe_dns_server: "{{ management_dns_server }}"

br_pxe_dhcp:
  enabled: "{{ topology.north_south.fabric_type | default('') == 'bridge' }}"
  range_start: "{{ pxe_base }}.100"
  range_end: "{{ pxe_base }}.200"
  netmask: 255.255.255.0
  lease_time: 1h

br_mgmt_name: br-mgmt

br_mgmt_netmask: 24

# Addresses br-mgmt answers on: one gateway per management range. The host octet
# differs per host -- .254 by default, .1 on gtw01 via inventory.yml -- so the
# three base entries land on both nodes without colliding.
#
# The Verity pair is pinned to gtws instead, because those two addresses are
# fixed (.254) rather than per-host: the leaves route to 10.200.1.254 with no
# say in the matter, so it has to exist on exactly one node. gtws is that node.
br_mgmt_addresses: >-
  {{ [management_gateway_sg, management_gateway_server, management_gateway_switch]
     + ([management_gateway_verity_switch, management_gateway_verity_controller]
        if ((ufo_fabric_backend | default(sdn_provider)) == 'verity'
            and 'gtws' in group_names)
        else []) }}

# NIC enslaved to br-mgmt in netplan; also included in cloud-init netplan prune list when set.
br_mgmt_phys_interface: ""
# Extra interface names (stanza key or set-name) to strip addresses/nameservers from in
# /etc/netplan/50-cloud-init.yaml (merged with br_mgmt_phys_interface).
netplan_cloudinit_prune_ifaces: []

# Host DHCP on br-mgmt for switch/SG OOB (netris). Range is overridable via ansible vars.
br_mgmt_dhcp:
  enabled: "{{ ufo_fabric_backend | default(sdn_provider) == 'netris' }}"
  range_start: "{{ management_base_switch }}.200"
  range_end: "{{ management_base_switch }}.210"
  netmask: 255.255.255.0
  lease_time: 1h

br_ext_name: br-ext
br_ext_netmask: 24
br_ext_phys_interface: ""


