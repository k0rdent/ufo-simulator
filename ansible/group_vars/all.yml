nico_cluster_physical_subnet: ns-subnet
nico_site_name: local-dev-site
nico_prepovision_instance_type_name: gpu-a100
nico_prepovision_operating_system_name: ubuntu-22.04
nico_prepovision_ssh_key_group_name: platform-admin-keys
nico_prepovision_network_security_group_name: allow-all
external_secrets_namespace: external-secrets
external_secrets_chart_repo: https://charts.external-secrets.io
external_secrets_chart_version: 2.7.0

# MetalLB address for the Traefik LoadBalancer (ansible/traefik.yml), which
# fronts both the Netris UI/API and the fabric-facing agent ports. The Netris
# ingress routes / to the frontend and /api + /socket.io to the backend, so the
# API shares this address rather than having its own.
netris_controller_ip: 10.172.1.100
netris_web_api_url: "http://{{ netris_controller_ip }}"

kubeconfig_path: "/root/.kube/config"

docker_image_proxy: https://dockerproxy.artifactory-eu.mcp.mirantis.net
containerd_certs_d_path: /etc/containerd/certs.d
nico_kind_certs_d_dir: "{{ nico_rest_infra_controller_dir }}/rest-api/deploy/kind/certs.d"
containerd_registry_hosts:
  - name: docker.io
    server: https://registry-1.docker.io
  - name: registry-1.docker.io
    server: https://registry-1.docker.io
  - name: gcr.io
    server: https://gcr.io

frr:
  enabled: true
  bgp:
    update_source: '{{ ext_base_gateway_switch }}'
    enabled: true
    router_id: '{{ ext_base_gateway_switch }}'
    asn: 64513
    sdn:
      asn: 64512
      peer_ranges:
      - "{{ ext_base_switch }}.0/24"


cats_mgmt_cidr: "10.11.0.0/24"
dogs_mgmt_cidr: "10.12.0.0/24"

external_gateway_bgp:
  local_ip: "{{ fabric_gateway_ip }}/{{ ext_sg_netmask }}"
  remote_ip: "{{ ext_base_gateway_switch_gtw }}/{{ ext_sg_netmask }}"
  prefix_list_outbound:
    - "permit {{ cats_mgmt_cidr }}"
    - "permit {{ dogs_mgmt_cidr }}"

host_masquerade_cidrs:
  - "{{ management_base_sg }}.0/{{ br_mgmt_netmask }}"
  - "{{ management_base_switch }}.0/16"
  - "{{ ext_base_sg }}.0/{{ ext_sg_netmask }}"
  - "{{ pxe_base }}.0/{{ br_pxe_netmask }}"
  - "{{ cats_mgmt_cidr }}"
  - "{{ dogs_mgmt_cidr }}"

sdn_provider: "netris" # or "verity"

users:
  - username: ubuntu
    sudo: true
    docker: true
    shell: '/bin/bash'
    ssh_key:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDKHYD4WFo0aVocuBooUlZEmJI/GBwUZ/sg4f+RaFN7m vsaienko@mirantis.com"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDTqwm8l33tGVsiLmrSH6xvzWutNg51ls29AelBwp4dh yar@yisakov-lpt"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKwcYGMXm8xg4Fa6ZXQ3ubLyQ21G8n8hSpYR3ihsDqSc"
