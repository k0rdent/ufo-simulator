---
- name: Install KCM
  hosts: cmps
  connection: local
  become: true
  gather_facts: true
  ignore_errors: false

  vars_files:
    - ./vars/common.yml
    - ./vars/{{ artifacts_vars_file }}
    - ./vars/{{ sdn_provider }}.yml

  vars:
    workspace: /opt/ufo_lab/
    kcm_chart_repo: oci://ghcr.io/k0rdent/kcm/charts/kcm
    kcm_chart_version: 1.12.0

  tasks:
    - name: Deploy/upgrade kcm chart
      kubernetes.core.helm:
        name: kcm
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: "{{ kcm_chart_repo }}"
        chart_version: "{{ kcm_chart_version }}"
        release_namespace: kcm-system
        create_namespace: true
        values:
          regional:
            telemetry:
              mode: disabled
            velero:
              enabled: false
          controller:
            defaultHelmTimeout: 90m
        # Once up, KCM takes this release over through its own Flux HelmRelease
        # and sets values of its own (e.g. regional.cluster-api-operator.enabled).
        # Resetting them on a re-run removes the CAPI operator, and any provider
        # dropped from the Management then hangs forever on its finalizer.
        reset_values: false
        reuse_values: true
        state: present
        wait: true
        # A cold install pulls cert-manager, flux, CAPI operator etc. images;
        # 300s was not always enough, and a timeout skips the templates below.
        wait_timeout: 900s

    - name: Ensure target directory
      file:
        path: "{{ k8s_artifacts_dir }}/kcm/"
        state: directory

    - name: Handle kcm templates
      vars:
        kcm_templates: "{{ ['helm-repos.yml', 'management.yml'] + (['metal3-provider.yml'] if (metal3_provision_enabled | bool) else []) + (['nico-provider.yml'] if (nico_capi_provider_enabled | bool) else []) }}"
      block:
        - name: Render templates
          ansible.builtin.template:
            src: "k8s/kcm/{{ item }}"
            dest: "{{ k8s_artifacts_dir }}/kcm/{{ item }}"
          with_items: "{{ kcm_templates }}"

        - name: Apply Management object
          ansible.builtin.command:
            cmd: kubectl --kubeconfig {{ kubeconfig_path }} apply -f "{{ k8s_artifacts_dir }}/kcm/{{ item }}"
          with_items: "{{ kcm_templates }}"
