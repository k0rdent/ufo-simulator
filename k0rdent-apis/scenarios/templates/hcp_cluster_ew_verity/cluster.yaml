id: lab-verity-ew-01
displayName: Lab Verity E/W HCP cluster
clusterType: /v1/regions/local/compute/cluster-types/nico-verity-hcp-ew
nodePools:
  # Two workers so there is a cross-node path to test. Which machines the
  # scheduler picks is not fixed -- NicoMachineTemplate is annotated
  # 'random-instance-type' -- so they land on whichever host_ids are free.
  # Each gets (host_id << 1) added to its rail base with the leaf on the odd
  # half: host 2 on rail 0 is 172.16.0.4/31 via .5, at ewf-leaf-su00-r0 swp2s0.
  #
  # Avoid asserting on host 0 of rail 0: 172.16.0.0 collided with the fabric's
  # router-id base prefix and was unroutable until that was moved in Verity.
  - id: default
    nodeCount: 2
    securityGroups: []
sshAccess:
  - username: ubuntu
    displayName: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    sshPublicKeys:
      - ssh-rsa  /home/yar/.ssh/os-lab.pub
