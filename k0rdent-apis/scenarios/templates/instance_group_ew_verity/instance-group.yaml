id: lab-verity-ew-01
displayName: Lab Verity E/W group
clusterType: /v1/regions/local/compute/cluster-types/nico-verity-ew
nodePools:
  # Two nodes, so there is a cross-node path to ping. Which machines the
  # scheduler picks is not fixed -- NicoMachineTemplate is annotated
  # 'random-instance-type' -- so they land on whichever host_ids are free, not
  # necessarily adjacent subports. Each gets (host_id << 1) added to its rail
  # base with the leaf on the odd half: host 2 on rail 0 is 172.16.0.4/31 with
  # the leaf on .5, at ewf-leaf-su00-r0 swp2s0.
  - nodePool: default
    size: 2
sshAccess:
  - username: ubuntu
    displayName: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    sshPublicKeys:
      - ssh-rsa  /home/yar/.ssh/os-lab.pub
