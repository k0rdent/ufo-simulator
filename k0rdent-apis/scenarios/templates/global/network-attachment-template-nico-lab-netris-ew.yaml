# POST /v1/regions/local/networking/network-schema-templates/nico-netris-ew/network-attachment-templates
#
# Parent: network-schema-template-nico-netris-ew.yaml. nico-lab layout on the
# Netris east-west schema: DHCP management NIC, four rail-pinned east-west NICs,
# and one NVLink.
id: nico-lab-netris-ew
displayName: nico-lab with Netris east-west rails 0-3
machineTypes:
  - /v1/regions/local/infrastructure/machine-types/nico-lab
networkAttachment:
  # Rendered into the pool's UFO NetworkBundle as spec.host_config: each host's HostConfig
  # is seeded from the default-vm-v1 HostConfigTemplate, which the UFO Helm chart installs.
  host_agent:
    template: default-vm-v1
  ethernets:
    enp1s0:
      dhcp4: true
      connectToNetwork:
        name: ns-network
    eth-ew0:
      match:
        fabricLocation:
          railId: 0
      addresses:
        - ipFromSubnet: ew-subnet
      routes: &ew-routes
        - to:
            cidrFromRailsubnet:
              name: ew-subnet
          via:
            gatewayFromSubnet:
              name: ew-subnet
        - to:
            cidrFromSubnet:
              name: ew-subnet
          via:
            gatewayFromSubnet:
              name: ew-subnet
    eth-ew1:
      match:
        fabricLocation:
          railId: 1
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
    eth-ew2:
      match:
        fabricLocation:
          railId: 2
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
    eth-ew3:
      match:
        fabricLocation:
          railId: 3
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
  nvlinks:
    nvlink1:
      connectToNetwork: nvlink-partition
