# POST /v1/regions/local/networking/network-schema-templates/nico-verity-ew/network-attachment-templates
#
# Parent: network-schema-template-nico-verity-ew.yaml. nico-lab layout on the
# Verity east-west schema: DHCP management NIC plus four rail-pinned east-west
# NICs.
id: nico-lab-verity-ew
displayName: nico-lab with Verity east-west rails 0-3
machineTypes:
  - /v1/regions/local/infrastructure/machine-types/nico-lab
networkAttachment:
  # Rendered into the pool's UFO NetworkBundle as spec.host_config: each host's HostConfig
  # is seeded from the default-vm-v1 HostConfigTemplate, which the UFO Helm chart installs.
  host_agent:
    template: default-vm-v1
  ethernets:
    # Management. No `match`: the NIC behind enp1s0 has no LLDP peer and so
    # no Link CR, which is what byslot and fabricLocation resolve against --
    # the OS-predictable name is the key instead.
    enp1s0:
      dhcp4: true
      connectToNetwork:
        name: net-nico
    # Rails 0-3, matching the Netris layout. Selected by fabric location rather
    # than by name: the Link CR carries rail_id, so each picks whichever NIC LLDP
    # found on that rail's leaf (rail 0 is eth5 -> ew-leaf-0 in this lab)
    # whatever the guest calls it.
    #
    # topology_ew wires 8 rail leaves, so more can be added the same way -- but
    # only once the leaf is registered in Verity. A railId with no registered
    # leaf produces no Link CR, so fabricLocation never resolves and the
    # allocation stalls until the test times out.
    eth-ew0:
      match:
        fabricLocation:
          railId: 0
      addresses:
        - ipFromSubnet: ew-subnet
      # Shared by every rail below: the routes are symbolic, and each
      # interface resolves cidrFromRailsubnet against its own rail.
      routes: &ew-routes
        # This node's own rail -- 172.16.0.0/25 for rail 0 -- which reaches
        # every other host on the same leaf. That is the cross-node path.
        - to:
            cidrFromRailsubnet:
              name: ew-subnet
          via:
            gatewayFromSubnet:
              name: ew-subnet
        # The rest of the fabric, via the same leaf.
        - to:
            cidrFromSubnet:
              name: ew-subnet
          via:
            gatewayFromSubnet:
              name: ew-subnet
    eth-ew1:
      match:
        fabricLocation:
          railId: 1
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
    eth-ew2:
      match:
        fabricLocation:
          railId: 2
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
    eth-ew3:
      match:
        fabricLocation:
          railId: 3
      addresses:
        - ipFromSubnet: ew-subnet
      routes: *ew-routes
