# POST /v1/regions/local/networking/network-schema-templates
#
# NICo north-south VPC plus a Netris-backed east-west VPC, and an NVLink
# partition. Referenced by cluster-type-netris-hcp-ew.yaml.
id: nico-netris-ew
displayName: NICo + Netris east-west
networkSchema:
  vpcs:
    - id: vpc-nico
      backend: nico
    - id: vpc-ew
      backend: netris
  networks:
    - id: ns-network
      vpc: vpc-nico
      type: evpn
      evpn:
        type: l3vpn
    - id: ew-network
      vpc: vpc-ew
      type: evpn
      evpn:
        type: l3vpn
    - id: nvlink-partition
      vpc: vpc-nico
      type: nvlink
  subnets:
    - id: ns-subnet
      network: ns-network
      addressPool: /v1/regions/local/compute/address-pools/global-default
      prefixLength: 27
    # Fixed CIDR + rail-optimised allocator: needs k0rdent-apis e290b5691
    # ("KNF-490: Fixed-CIDR subnets, ethernet static routes, and rail-optimised
    # P2P addressing"). Against an older API the create fails with
    #   422 networkSchema.subnets[].addressPool is required
    - id: ew-subnet
      network: ew-network
      cidr: 172.16.0.0/12
      addressAllocator:
        backend: rail-optimised
        gpuPlatform: B200
