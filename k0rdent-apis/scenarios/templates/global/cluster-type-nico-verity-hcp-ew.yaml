id: nico-verity-hcp-ew
displayName: NICo + Verity east-west (HCP k0s)
networkSchema:
  vpcs:
    - id: vpc-nico
      backend: nico
    # The named backend instance, not the driver. ufo_conf.yaml declares two
    # verity instances and only this one sets site + fabric_type, so only this
    # one answers IsSpectrumX() and takes the Spectrum-X attach path. Pointing
    # at the bare "verity" instance instead runs the Clos path, which creates
    # EthPortProfiles and Switchports and never an HGXTenantAssignment -- the
    # east-west attachment would silently never happen.
    - id: vpc-ew
      backend: verity-ewf
  networks:
    - id: net-nico
      vpc: vpc-nico
      type: evpn
      evpn:
        type: l3vpn
    - id: ew-network
      vpc: vpc-ew
      type: evpn
      evpn:
        type: l3vpn
  subnets:
    - id: sub-nico
      network: net-nico
      addressPool: /v1/regions/local/compute/address-pools/global-default
      prefixLength: 27
    - id: ew-subnet
      network: ew-network
      # Base for the rail-optimised /31s, and it must match Verity's underlay
      # pool exactly: each side derives the /31 from its own view of the
      # topology, so a different base means different addresses at the two ends
      # of the same wire and the link never comes up. Verity allocates from
      # 172.16.0.0 with (rail << 17) | (su << 8) | (host << 1), host even and
      # switch odd -- the same layout UFO's rail-optimised allocator computes.
      # So rail 0 host 0 is 172.16.0.0/31 with the leaf on .1, host 1 is
      # .2/.3, and each rail occupies 172.(16 + 2*rail).0.0/25.
      cidr: 172.16.0.0/12
      addressAllocator:
        backend: rail-optimised
        gpuPlatform: B200
# Deployed through /compute/clusters. The cidr + addressAllocator pair above
# needs k0rdent-apis e290b5691 ("KNF-490: Fixed-CIDR subnets, ethernet static
# routes, and rail-optimised P2P addressing"), which added those fields to
# NetworkSchemaSubnet. Against an older API they are dropped as unknown and the
# deploy fails with
#   422 networkSchema.subnets[].addressPool is required
# cluster-type-netris-hcp-ew.yaml carries the identical block, so if that one
# deploys this schema is supported.
k8s:
  k0sNetworkProvider: calico
  k0sVersion: v1.36.1
  podCidrs:
    - 10.243.0.0/16
  serviceCidrs:
    - 10.95.0.0/16
  clusterTemplateName: cluster-nico-0-0-0-main
  clusterTemplateVersion: 0.0.0-main
  services: []
  controlPlane:
    type: hcp
    replicas: 1
    bootstrapConfig: {}
    opConfig: {}
  workers:
    defaults: {}
nodePools:
  - id: default
    role: worker
    machineType: /v1/regions/local/infrastructure/machine-types/nico-lab
    nodeCountMin: 1
    nodeCountMax: 6
    nodeCountDefault: 2
    networkAttachment:
      ethernets:
        # Management. No `match`: the NIC behind enp1s0 has no LLDP peer and so
        # no Link CR, which is what byslot and fabricLocation resolve against --
        # the OS-predictable name is the key instead.
        enp1s0:
          dhcp4: true
          connectToNetwork:
            name: net-nico
        # Rail 0. Selected by fabric location rather than by name: the Link CR
        # carries rail_id, so this picks whichever NIC LLDP found on the rail-0
        # leaf (eth5 -> ew-leaf-0 in this lab) whatever the guest calls it.
        #
        # Add rails 1-7 by repeating this block with railId 1..7; the routes
        # are symbolic, so an anchor can be shared across them -- each
        # interface resolves cidrFromRailsubnet against its own rail.
        eth-ew0:
          match:
            fabricLocation:
              railId: 0
          addresses:
            - ipFromSubnet: ew-subnet
          routes:
            # This node's own rail -- 172.16.0.0/25 for rail 0 -- which reaches
            # every other host on the same leaf. That is the cross-node path.
            - to:
                cidrFromRailsubnet:
                  name: ew-subnet
              via:
                gatewayFromSubnet:
                  name: ew-subnet
            # The rest of the fabric, via the same leaf.
            - to:
                cidrFromSubnet:
                  name: ew-subnet
              via:
                gatewayFromSubnet:
                  name: ew-subnet
