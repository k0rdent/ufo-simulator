id: nico-verity-hcp-ew
displayName: NICo + Verity east-west (HCP k0s)
# Deployed through /compute/clusters. Networking comes from templates
# (k0rdent-apis KNF-460): the schema from network-schema-template-nico-verity-ew.yaml,
# the pool's NIC layout from network-attachment-template-nico-lab-verity-ew.yaml.
# cluster-type-nico-verity-ew.yaml (BMaaS) references the same two templates.
networkSchemaRef:
  template: /v1/regions/local/networking/network-schema-templates/nico-verity-ew
k8s:
  k0sNetworkProvider: calico
  k0sVersion: v1.36.1
  podCidrs:
    - 10.243.0.0/16
  serviceCidrs:
    - 10.95.0.0/16
  clusterTemplateName: cluster-nico-0-0-0-main
  clusterTemplateVersion: 0.0.0-main
  services: []
  controlPlane:
    type: hcp
    replicas: 1
    bootstrapConfig: {}
    opConfig: {}
  workers:
    defaults: {}
nodePools:
  - id: default
    role: worker
    machineType: /v1/regions/local/infrastructure/machine-types/nico-lab
    nodeCountMin: 1
    nodeCountMax: 6
    nodeCountDefault: 2
    networkAttachmentRef:
      template: /v1/regions/local/networking/network-schema-templates/nico-verity-ew/network-attachment-templates/nico-lab-verity-ew
