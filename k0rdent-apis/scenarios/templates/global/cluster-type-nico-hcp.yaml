id: nico-hcp
displayName: NICo HCP k0s
# Networking comes from templates (k0rdent-apis KNF-460): the schema from
# network-schema-template-nico.yaml, the pool's NIC layout from
# network-attachment-template-nico-lab.yaml. A ClusterType is all-inline or
# all-templated; mixing the two is a 422.
networkSchemaRef:
  template: /v1/regions/local/networking/network-schema-templates/nico
k8s:
  k0sNetworkProvider: calico
  k0sVersion: v1.36.1
  podCidrs:
    - 10.243.0.0/16
  serviceCidrs:
    - 10.95.0.0/16
  clusterTemplateName: cluster-nico-0-0-0-main
  clusterTemplateVersion: 0.0.0-main
  services: []
  controlPlane:
    type: hcp
    replicas: 1
    bootstrapConfig: {}
    opConfig: {}
  workers:
    defaults: {}
nodePools:
  - id: default
    role: worker
    # Must be one of the attachment template's machineTypes.
    machineType: /v1/regions/local/infrastructure/machine-types/nico-lab
    nodeCountMin: 1
    nodeCountMax: 6
    nodeCountDefault: 1
    networkAttachmentRef:
      template: /v1/regions/local/networking/network-schema-templates/nico/network-attachment-templates/nico-lab
