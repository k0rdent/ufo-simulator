id: nico-verity-ew
displayName: NICo + Verity east-west (BMaaS)
# No k8s block: this is the standalone BMaaS path, deployed via
# /compute/instance-groups rather than /compute/clusters.
#
# Networking comes from the same templates as cluster-type-nico-verity-hcp-ew.yaml
# (k0rdent-apis KNF-460): network-schema-template-nico-verity-ew.yaml and
# network-attachment-template-nico-lab-verity-ew.yaml.
networkSchemaRef:
  template: /v1/regions/local/networking/network-schema-templates/nico-verity-ew
nodePools:
  - id: default
    role: worker
    machineType: /v1/regions/local/infrastructure/machine-types/nico-lab
    nodeCountMin: 1
    nodeCountMax: 6
    nodeCountDefault: 2
    networkAttachmentRef:
      template: /v1/regions/local/networking/network-schema-templates/nico-verity-ew/network-attachment-templates/nico-lab-verity-ew
