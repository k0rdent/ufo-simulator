id: ig-sg
displayName: Instance-group-level e2e security group
rules:
  ingress:
    - name: ig-allow-ssh
      protocol: tcp
      action: permit
      sourcePrefix: 8.8.8.8/32
      destinationPrefix: 10.5.44.0/24
      destinationPortRange: "22"
  egress:
    - name: ig-allow-dns
      protocol: udp
      action: permit
      sourcePrefix: 10.5.44.0/24
      destinationPrefix: 8.8.8.8/32
      destinationPortRange: "53"
