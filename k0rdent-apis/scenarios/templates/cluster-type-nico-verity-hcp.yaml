id: nico-verity-hcp
displayName: NICo + Verity HCP k0s
networkSchema:
  vpcs:
    - id: vpc-nico
      backend: nico
    - id: vpc-verity
      backend: verity
  networks:
    - id: net-nico
      vpc: vpc-nico
      type: evpn
      evpn:
        type: l3vpn
    - id: net-verity
      vpc: vpc-verity
      type: evpn
      evpn:
        type: l2vpn
      vlan:
        id: "500"
  subnets:
    - id: sub-nico
      network: net-nico
      addressPool: /v1/regions/local/compute/address-pools/global-default
      prefixLength: 27
    - id: sub-verity
      network: net-verity
      addressPool: /v1/regions/local/compute/address-pools/global-public
      prefixLength: 29
k8s:
  k0sNetworkProvider: calico
  k0sVersion: v1.36.1
  podCidrs:
    - 10.243.0.0/16
  serviceCidrs:
    - 10.95.0.0/16
  clusterTemplateName: cluster-nico-0-0-0-main
  clusterTemplateVersion: 0.0.0-main
  services: []
  controlPlane:
    type: hcp
    replicas: 1
    bootstrapConfig: {}
    opConfig: {}
  workers:
    defaults: {}
nodePools:
  - id: default
    role: worker
    machineType: /v1/regions/local/infrastructure/machine-types/nico-lab
    nodeCountMin: 1
    nodeCountMax: 6
    nodeCountDefault: 1
    networkAttachment:
      ethernets:
        enp1s0:
          dhcp4: true
          connectToNetwork:
            name: net-nico
        verity1:
          match:
            pciSlot: "0000:a3:00.0"
          dhcp4: false
          connectToNetwork:
            name: net-verity
