[pytest]
testpaths = tests
markers =
    smoke: short lab smoke against live k0rdent-apis + k8s
    hcp: hosted control-plane cluster scenarios
    bmaas: instance-group / bare-metal scenarios
    peering: VPC peering scenarios (require MOCK_MODE off — they assert real CRs)
    crossorg: peering across two orgs/projects; builds a second cluster
timeout = 1800
addopts = -ra
